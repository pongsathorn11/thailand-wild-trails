    if (e.code === 'ArrowLeft' || e.code === 'KeyA') profile.pack[id] = Math.max(0, (profile.pack[id] || 0) - 1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      const next = Math.min(packMax(id), (profile.pack[id] || 0) + 1);
      const extraSlot = ITEMS[id].stack === 1 || !profile.pack[id];
      if (next > (profile.pack[id] || 0) && (!extraSlot || Backpack.packSlots(profile.pack) < CONFIG.MAX_SLOTS)) profile.pack[id] = next;
    }
    if (e.code === 'Escape') state.screen = 'camp';
    if (e.code === 'Enter' || e.code === 'Space') { Save.write(profile); startGame(); }
    return;
  }
  if (state.screen === 'summary' || state.screen === 'rescue') {
    if (e.code === 'Enter' || e.code === 'Space') { state.weather = rollWeather(); Camp.enter(); }
    return;
  }
  if (state.screen === 'play') {
    if (e.code === 'KeyE' || e.code === 'Space') {
      if (state.dialog) {
        state.dialog.i++;
        if (state.dialog.i >= state.dialog.lines.length) state.dialog = null;
      } else Interact.run(Interact.find());
    }
    const m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code);
    if (m) Backpack.use(m[1] === '0' ? 9 : Number(m[1]) - 1);
    if (e.code === 'Minus') Backpack.use(10);
    if (e.code === 'Equal') Backpack.use(11);
  }
}
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in vkeys) vkeys[k] = false; });

// ============================================================
// 6. RENDER  (draws only, never changes state)
// ============================================================
const worldCanvas = document.getElementById('world'), wctx = worldCanvas.getContext('2d');
const hudCanvas = document.getElementById('hud'), hctx = hudCanvas.getContext('2d');
const lightCanvas = makeCanvas(1, 1), lctx = lightCanvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
const rain = [];

function resize() {
  CONFIG.SCALE = Math.min(innerWidth, innerHeight) < 560 ? 2 : 3; // phones: show more of the map
  const S = CONFIG.SCALE;
  VW = Math.ceil(innerWidth / S); VH = Math.ceil(innerHeight / S);
  worldCanvas.width = VW; worldCanvas.height = VH;
  worldCanvas.style.width = VW * S + 'px'; worldCanvas.style.height = VH * S + 'px';
  lightCanvas.width = VW; lightCanvas.height = VH;
  DPR = window.devicePixelRatio || 1;
  hudCanvas.width = Math.round(innerWidth * DPR); hudCanvas.height = Math.round(innerHeight * DPR);
  hudCanvas.style.width = innerWidth + 'px'; hudCanvas.style.height = innerHeight + 'px';
  rain.length = 0;
  for (let i = 0; i < 140; i++) rain.push({ x: Math.random() * VW, y: Math.random() * VH, s: 140 + Math.random() * 80 });
}
window.addEventListener('resize', resize);

function camera(focusX, focusY) {
  const ww = W * TS, wh = H * TS;
  const cx = ww <= VW ? (ww - VW) / 2 : clamp(focusX - VW / 2, 0, ww - VW);
  const cy = wh <= VH ? (wh - VH) / 2 : clamp(focusY - VH / 2, 0, wh - VH);
  return [Math.round(cx), Math.round(cy)];
}

const Props = {
  sign(c, x, y) {
    c.fillStyle = '#6b4528'; c.fillRect(x - 1, y - 10, 2, 10);
    c.fillStyle = '#8a5a30'; c.fillRect(x - 8, y - 17, 16, 9);
    c.fillStyle = '#d8b37a'; c.fillRect(x - 7, y - 16, 14, 7);
    c.fillStyle = '#8a5a30'; c.fillRect(x - 5, y - 14, 10, 1); c.fillRect(x - 5, y - 12, 7, 1);
  },
  bench(c, x, y) {
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 9, y - 1, 18, 2);
    c.fillStyle = '#5a3818'; c.fillRect(x - 7, y - 4, 2, 4); c.fillRect(x + 5, y - 4, 2, 4);
    c.fillStyle = '#9a6a3a'; c.fillRect(x - 9, y - 6, 18, 3);
    c.fillStyle = '#7a4e28'; c.fillRect(x - 9, y - 11, 18, 2); c.fillRect(x - 8, y - 9, 1, 3); c.fillRect(x + 7, y - 9, 1, 3);
  },
  viewpoint(c, x, y) {
    c.fillStyle = '#6b4528';
    for (let i = -16; i <= 16; i += 8) c.fillRect(x + i, y - 9, 2, 9);
    c.fillStyle = '#9a6a3a'; c.fillRect(x - 16, y - 9, 34, 2); c.fillRect(x - 16, y - 5, 34, 1);
    // small sign with a camera icon
    c.fillStyle = '#6b4528'; c.fillRect(x + 20, y - 12, 2, 12);
    c.fillStyle = '#2f5d8a'; c.fillRect(x + 16, y - 18, 10, 7);
    c.fillStyle = '#fff'; c.fillRect(x + 18, y - 16, 6, 4); c.fillStyle = '#2f5d8a'; c.fillRect(x + 20, y - 15, 2, 2);
  },
  goal(c, x, y, active) {
    c.fillStyle = '#6b4528'; c.fillRect(x - 6, y - 12, 2, 12); c.fillRect(x + 4, y - 12, 2, 12);
    c.fillStyle = '#8a5a30'; c.fillRect(x - 9, y - 20, 18, 9);
    c.fillStyle = '#e8c88a'; c.fillRect(x - 8, y - 19, 16, 7);
    c.fillStyle = '#c0392b'; c.fillRect(x - 3, y - 18, 6, 5); c.fillStyle = '#e8c88a'; c.fillRect(x - 2, y - 17, 4, 3);
    c.fillStyle = '#555'; c.fillRect(x + 9, y - 28, 1, 28);
    c.fillStyle = active ? '#e74c3c' : '#999'; c.fillRect(x + 10, y - 28, 8, 5);
  },
  rhodo(c, x, y, time) {
    blob(c, x, y - 6, 6, '#2f6b2f'); blob(c, x - 2, y - 8, 4, '#3f8a3a');
    c.fillStyle = '#d8343f';
    for (const [fx, fy] of [[-4, -9], [1, -11], [3, -6], [-1, -5], [4, -10]]) c.fillRect(x + fx, y + fy + (Math.sin(time * 2 + fx) > 0.9 ? -1 : 0), 2, 2);
  },
  moss(c, x, y) {
    blob(c, x, y - 4, 5, '#6d6f74'); blob(c, x - 1, y - 6, 4, '#4f8a3c');
    c.fillStyle = '#7cc05a'; c.fillRect(x - 3, y - 8, 1, 1); c.fillRect(x + 1, y - 7, 1, 1);
    c.fillStyle = '#5aa64a'; c.fillRect(x + 5, y - 7, 1, 6); c.fillRect(x + 3, y - 6, 2, 1); c.fillRect(x + 6, y - 5, 2, 1);
  },
  flashlight(c, x, y, time) {
    const b = Math.round(Math.sin(time * 3) * 1);
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 3, y - 1, 7, 1);
    c.fillStyle = '#f0c23a'; c.fillRect(x - 3, y - 5 + b, 6, 3);
    c.fillStyle = '#fff8c0'; c.fillRect(x + 3, y - 5 + b, 1, 3);
    if (Math.sin(time * 4) > 0.6) { c.fillStyle = '#fff'; c.fillRect(x - 1, y - 8 + b, 1, 1); }
  },
  litter(c, x, y, kind) {
    if (kind === 0) { c.fillStyle = '#bfe3f0'; c.fillRect(x - 1, y - 5, 2, 5); c.fillStyle = '#3b7dd8'; c.fillRect(x - 1, y - 6, 2, 1); }
    else { c.fillStyle = '#e85a5a'; c.fillRect(x - 2, y - 2, 4, 2); c.fillStyle = '#f5f5f5'; c.fillRect(x - 1, y - 2, 1, 1); }
  },
  falls(c, x, y, time) { // x = stream center, y = where water meets the pool
    blob(c, x - 13, y - 8, 7, '#6d6f74'); blob(c, x + 13, y - 8, 7, '#7d7f86'); blob(c, x - 12, y - 11, 4, '#4f8a3c'); blob(c, x + 14, y - 12, 3, '#4f8a3c');
    c.fillStyle = '#8a8c92'; c.fillRect(x - 10, y - 20, 20, 4);
    for (let i = 0; i < 10; i++) {
      const cx = x - 9 + i * 2;
      c.fillStyle = i % 2 ? '#bfe8f0' : '#f2fbff'; c.fillRect(cx, y - 17, 2, 16);
      const o = Math.floor((time * 30 + i * 5) % 16);
      c.fillStyle = '#7fcfd8'; c.fillRect(cx, y - 17 + o, 2, 2);
    }
    const f = Math.sin(time * 6);
    blob(c, x, y, 7, 'rgba(255,255,255,0.75)');
    c.fillStyle = 'rgba(255,255,255,0.8)'; c.fillRect(x - 11 + Math.round(f), y + 2, 3, 1); c.fillRect(x + 8 - Math.round(f), y + 1, 3, 1);
  },
  tierSign(c, x, y, n) {
    c.fillStyle = '#6b4528'; c.fillRect(x - 1, y - 10, 2, 10);
    c.fillStyle = '#2a7db0'; c.fillRect(x - 6, y - 17, 12, 8);
    c.fillStyle = '#f4ecd8'; // tier number as pips
    for (let i = 0; i < n; i++) c.fillRect(x - 5 + (i % 4) * 3, y - 16 + Math.floor(i / 4) * 3, 2, 2);
  },
  bigPine(c, x, y) {
    c.fillStyle = 'rgba(0,0,0,0.22)'; c.fillRect(x - 10, y - 2, 20, 3);
    c.fillStyle = '#5e3c22'; c.fillRect(x - 2, y - 14, 4, 14); c.fillStyle = '#4a2e18'; c.fillRect(x - 2, y - 14, 1, 14);
    for (let i = 0; i < 5; i++) {
      const top = y - 40 + i * 6, hw = 3 + i * 2;
      for (let r = 0; r < 9; r++) { const w = Math.round((r / 8) * hw) + 1; c.fillStyle = '#24503a'; c.fillRect(x - w, top + r, w * 2, 1); c.fillStyle = '#356a48'; c.fillRect(x - w, top + r, w, 1); }
    }
  },
  maple(c, x, y, time) {
    const red = season() === 'cool';
    c.fillStyle = 'rgba(0,0,0,0.22)'; c.fillRect(x - 9, y - 2, 18, 3);
    c.fillStyle = '#6b4528'; c.fillRect(x - 1, y - 12, 3, 12);
    blob(c, x, y - 16, 8, red ? '#b8322a' : '#3f8a3a'); blob(c, x - 2, y - 18, 5, red ? '#e0523a' : '#5aa64a');
    if (red) { c.fillStyle = '#f2a03a'; c.fillRect(x + 3, y - 20, 2, 2); c.fillRect(x - 5, y - 13, 2, 2);
      const f = (time * 12) % 14; c.fillStyle = '#e0523a'; c.fillRect(x + 6 - Math.round(f / 3), y - 10 + Math.round(f), 1, 1); }
  },
  stall(c, x, y) {
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 11, y - 1, 22, 2);
    c.fillStyle = '#6b4528'; c.fillRect(x - 10, y - 16, 2, 16); c.fillRect(x + 8, y - 16, 2, 16);
    for (let i = 0; i < 22; i++) { c.fillStyle = i % 4 < 2 ? '#3b7dd8' : '#f4ecd8'; c.fillRect(x - 11 + i, y - 19, 1, 4); }
    c.fillStyle = '#9a6a3a'; c.fillRect(x - 9, y - 7, 18, 3);
    c.fillStyle = '#bfe3f0'; c.fillRect(x - 6, y - 11, 2, 4); c.fillRect(x - 3, y - 11, 2, 4);
    c.fillStyle = '#f4ecd8'; c.fillRect(x + 2, y - 9, 3, 2); c.fillStyle = '#c8955a'; c.fillRect(x + 5, y - 9, 2, 2);
  },
  deer(c, x, y, time, faceLeft) {
    const f = faceLeft ? -1 : 1, r = (px, py, w, h, col) => { c.fillStyle = col; c.fillRect(f > 0 ? x + px : x - px - w, y + py, w, h); };
    const head = Math.sin(time * 1.5) > 0.6 ? 1 : 0; // grazing
    r(-6, -1, 13, 2, 'rgba(0,0,0,0.2)');
    r(-5, -6, 2, 6, '#7a4a26'); r(3, -6, 2, 6, '#7a4a26');
    r(-6, -11, 12, 6, '#b06a34'); r(-6, -7, 12, 1, '#8a5028');
    r(-7, -11, 1, 2, '#f4ecd8');
    r(5, -15 + head * 3, 3, 5, '#b06a34'); r(7, -13 + head * 3, 3, 2, '#9a5a2c');
    r(6, -17 + head * 3, 1, 2, '#5a3a1a'); r(8, -14 + head * 3, 1, 1, '#222');
  },
  bag(c, x, y, time) {
    const b = Math.round(Math.sin(time * 3));
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 4, y - 1, 8, 1);
    c.fillStyle = '#c8955a'; c.fillRect(x - 3, y - 6 + b, 6, 5);
    c.fillStyle = '#8a5a30'; c.fillRect(x - 3, y - 7 + b, 6, 1);
    if (Math.sin(time * 4) > 0.6) { c.fillStyle = '#fff'; c.fillRect(x + 2, y - 9 + b, 1, 1); }
  },
  sparkle(c, x, y, time) {
    const a = (Math.sin(time * 3) + 1) / 2;
    c.fillStyle = `rgba(255,255,255,${0.3 + a * 0.6})`;
    c.fillRect(x, y - 9, 1, 5); c.fillRect(x - 2, y - 7, 5, 1);
  },
  karst(c, x, y, seed) { // limestone pillar with jungle on top; (x, y) = base center
    const rng = mulberry32(seed), w = 34 + Math.floor(rng() * 8), h = 72 + Math.floor(rng() * 30);
    c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(x - w - 2, y - 3, w * 2 + 4, 4);
    for (let i = 0; i < h; i++) { // tapered column, wider at the base
      const k = i / h, hw = Math.round(w * (0.55 + 0.45 * k) + Math.sin(i * 0.4 + seed) * 2);
      c.fillStyle = '#8a8c90'; c.fillRect(x - hw, y - h + i, hw * 2, 1);
      c.fillStyle = '#a4a6aa'; c.fillRect(x - hw, y - h + i, Math.round(hw * 0.6), 1);
      c.fillStyle = '#6d6f74'; c.fillRect(x + hw - 3, y - h + i, 3, 1);
    }
    c.fillStyle = '#7a7c80'; for (let i = 0; i < 6; i++) { const sx = x - w + 4 + Math.floor(rng() * (w * 2 - 8)); c.fillRect(sx, y - h + 8 + Math.floor(rng() * 10), 1, 14 + Math.floor(rng() * 20)); }
    blob(c, x - 4, y - h + 2, Math.round(w * 0.6), '#2f6b2f'); blob(c, x + 6, y - h + 4, Math.round(w * 0.45), '#3f8a3a'); blob(c, x - 8, y - h, 4, '#5aa64a');
    c.fillStyle = '#3f8a3a'; for (let i = 0; i < 4; i++) { const vx = x - w + 6 + Math.floor(rng() * (w * 2 - 12)); c.fillRect(vx, y - h + 6, 1, 10 + Math.floor(rng() * 18)); }
    blob(c, x - w + 2, y - 4, 5, '#3f7a3a'); blob(c, x + w - 2, y - 3, 4, '#2f6b2f');
  },
  rafflesia(c, x, y) { // Rafflesia: blooms only in the cool/hot season, a bud otherwise
    if (!['cool', 'hot'].includes(season())) { blob(c, x, y - 4, 4, '#6b3a22'); blob(c, x - 1, y - 5, 2, '#8a5030'); return; }
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 10, y - 1, 20, 2);
    for (let a = 0; a < 5; a++) { const ang = a / 5 * Math.PI * 2 - Math.PI / 2, px = Math.round(x + Math.cos(ang) * 6), py = Math.round(y - 6 + Math.sin(ang) * 4); blob(c, px, py, 4, '#b0302a'); c.fillStyle = '#f0d8c8'; c.fillRect(px - 1, py - 1, 1, 1); c.fillRect(px + 1, py, 1, 1); }
    blob(c, x, y - 6, 4, '#7a1e1a'); blob(c, x, y - 6, 2, '#3a0e0c');
  },
  hornbill(c, x, y, time, flying) {
    const bob = flying ? Math.round(Math.sin(time * 14)) : (Math.sin(time * 4) > 0.8 ? -1 : 0), yy = y - (flying ? 18 : 3) + bob;
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 4, y, 8, 1);
    c.fillStyle = '#1e1e22'; c.fillRect(x - 4, yy - 5, 8, 5); c.fillRect(x - 9, yy - 3, 5, 2);
    c.fillStyle = '#f4f4f4'; c.fillRect(x - 9, yy - 2, 3, 1); c.fillRect(x - 3, yy - 1, 6, 1);
    c.fillStyle = '#1e1e22'; c.fillRect(x + 3, yy - 8, 3, 4);
    c.fillStyle = '#f2c22a'; c.fillRect(x + 6, yy - 7, 5, 2); c.fillRect(x + 5, yy - 9, 5, 2);
    c.fillStyle = '#d8402a'; c.fillRect(x + 9, yy - 9, 2, 1);
    c.fillStyle = '#fff'; c.fillRect(x + 4, yy - 7, 1, 1);
    if (flying) { c.fillStyle = '#2a2a30'; c.fillRect(x - 6, yy - 9 - bob * 2, 9, 3); c.fillStyle = '#f4f4f4'; c.fillRect(x - 6, yy - 9 - bob * 2, 2, 3); }
  },
  bird(c, x, y, time, flying) {
    const bob = flying ? Math.round(Math.sin(time * 20)) : (Math.sin(time * 6) > 0.7 ? -1 : 0);
    const yy = y - (flying ? 14 : 2) + bob;
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 2, y, 4, 1);
    c.fillStyle = '#2f9a5a'; c.fillRect(x - 2, yy - 3, 4, 3);
    c.fillStyle = '#e04a3a'; c.fillRect(x - 1, yy - 3, 2, 1);
    c.fillStyle = '#2f9a5a'; c.fillRect(x - 5, yy - 2, 3, 1);
    c.fillStyle = '#222'; c.fillRect(x + 2, yy - 3, 2, 1);
    if (flying) { c.fillStyle = '#26804a'; c.fillRect(x - 1, yy - 5 - bob, 3, 2); }
  },
};

function renderWorld() {
  const c = wctx;
  c.imageSmoothingEnabled = false;
  const p = state.player;
  const focus = p ? [p.x, p.y - 10] : [TRAIL.start[0] * TS + 120, TRAIL.start[1] * TS - 80];
  const [camX, camY] = camera(focus[0], focus[1]);
  state.cam = [camX, camY];
  const time = performance.now() / 1000;
  c.fillStyle = '#16241c'; c.fillRect(0, 0, VW, VH);
  c.drawImage(World.ground, -camX, -camY);

  // Water shimmer
  const tx0 = Math.max(0, Math.floor(camX / TS)), ty0 = Math.max(0, Math.floor(camY / TS));
  const tx1 = Math.min(W - 1, Math.ceil((camX + VW) / TS)), ty1 = Math.min(H - 1, Math.ceil((camY + VH) / TS));
  c.fillStyle = 'rgba(200,235,255,0.7)';
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    if (World.tiles[y * W + x] !== T.WATER) continue;
    const o = Math.floor((x * 7 + y * 5 + time * 14) % 16);
    c.fillRect(x * TS + o - camX, y * TS + ((o * 3) % 14) - camY, 3, 1);
    c.fillRect(x * TS + ((o + 8) % 16) - camX, y * TS + ((o * 5 + 7) % 14) - camY, 2, 1);
  }

  // Y-sorted drawables
  const list = [];
  const inView = (x, y, m = 32) => x > camX - m && x < camX + VW + m && y > camY - m && y < camY + VH + m + 16;
  for (const tr of World.trees) {
    if (!inView(tr.x, tr.y)) continue;
    list.push({ y: tr.y, draw: () => {
      const spr = Assets.trees[tr.type][tr.v];
      const x = tr.x - camX, y = tr.y - camY;
      c.fillStyle = 'rgba(0,0,0,0.22)'; c.fillRect(x - spr.w / 2 + 3, y - 2, spr.w - 6, 3);
      c.drawImage(spr.trunk, x - spr.w / 2, y - spr.h + 1);
      const sway = Math.round(Math.sin(time * 1.4 + tr.phase) * 0.8);
      c.drawImage(spr.canopy, x - spr.w / 2 + sway, y - spr.h + 1);
    } });
  }
  if (p) {
    for (const poi of TRAIL.pois) {
      const x = poi.x * TS + 8, y = poi.y * TS + 14;
      if (!inView(x, y)) continue;
      if ((poi.type === 'item' || poi.type === 'secret') && state.done[poi.id]) continue;
      list.push({ y, draw: () => {
        const sx = x - camX, sy = y - camY;
        switch (poi.type) {
          case 'sign': Props.sign(c, sx, sy); break;
          case 'bench': Props.bench(c, sx, sy); break;
          case 'viewpoint': Props.viewpoint(c, sx, sy); break;
          case 'goal': Props.goal(c, sx, sy, !TRAIL.checkpointId || state.checkpoint); break;
          case 'photo': Props[poi.prop](c, sx, sy, time); break;
          case 'stall': Props.stall(c, sx, sy, time); break;
          case 'waterfall': Props.tierSign(c, sx, sy, poi.n || Number(poi.id.slice(4)) || 1); break;
          case 'item': Props.flashlight(c, sx, sy, time); break;
          case 'secret': if (Math.hypot(p.x - x, p.y - y) < 90 + 40 * skillRank('exploration')) Props.sparkle(c, sx, sy, time); break;
          case 'npc': Mini.draw(c, sx, sy, GUIDE_LOOK, p.x < x ? 'left' : 'right', 0, 1); break;
        }
      } });
    }
    for (const d of TRAIL.decor || []) {
      if (d.type === 'karst') {
        const x = d.x * TS + 8, y = (d.y + 2) * TS + 12;
        if (inView(x, y - 40, 80)) list.push({ y, draw: () => Props.karst(c, x - camX, y - camY, d.x * 7 + d.y) });
        continue;
      }
      const x = d.x * TS + 16, y = d.y * TS + 12;
      if (inView(x, y, 48)) list.push({ y: y - 30, draw: () => Props.falls(c, x - camX, y - camY, time) });
    }
    for (const l of state.litter) if (!l.taken && inView(l.x, l.y)) list.push({ y: l.y, draw: () => Props.litter(c, l.x - camX, l.y - camY, l.kind) });
    for (const s of state.spawns) if (inView(s.x, s.y)) list.push({ y: s.y, draw: () => {
      const sx = Math.round(s.x - camX), sy = Math.round(s.y - camY);
      if (s.kind === 'animal') Props.deer(c, sx, sy, time, p.x < s.x);
      else Props.bag(c, sx, sy, time);
    } });
    const b = state.bird;
    if (b && inView(b.x, b.y)) list.push({ y: b.y, draw: () => (TRAIL.bird.kind === 'hornbill' ? Props.hornbill : Props.bird)(c, Math.round(b.x - camX), Math.round(b.y - camY), time, b.flying) });
    list.push({ y: p.y, draw: () => {
      const sx = Math.round(p.x - camX), sy = Math.round(p.y - camY);
      if (p.sitting) Mini.draw(c, sx, sy, currentLook(), 'down', 0, 1, true);
      else Mini.draw(c, sx, sy, currentLook(), p.dir, p.frame, 1);
    } });
  }
  list.sort((a, b) => a.y - b.y);
  for (const d of list) d.draw();

  // Weather
  if (p && state.weather === 'drizzle') {
    c.fillStyle = 'rgba(40,60,90,0.12)'; c.fillRect(0, 0, VW, VH);
    c.fillStyle = 'rgba(190,210,240,0.55)';
    for (const r of rain) c.fillRect(Math.round(r.x), Math.round(r.y), 1, 3);
  }
  const h = Time.hour();
  let fog = 0;
  if (p && state.weather === 'fog') fog = h < 9 ? 0.42 : h < 11 ? 0.25 : 0.12;
  else if (p && h < 7) fog = 0.1;
  if (p) fog = Math.min(0.6, fog + Events.sum('fog'));
  if (fog > 0) {
    c.fillStyle = `rgba(225,235,240,${fog})`; c.fillRect(0, 0, VW, VH);
    c.fillStyle = `rgba(235,242,246,${fog * 0.6})`;
    for (let i = 0; i < 5; i++) {
      const by = ((i * 70 + time * 5) % (VH + 60)) - 30;
      c.fillRect(0, Math.round(by), VW, 14 + i * 3);
    }
  }
  // Light
  if (p) {
    const tint = Time.tint();
    if (tint) { c.fillStyle = tint; c.fillRect(0, 0, VW, VH); }
    const dark = Time.darkness();
    if (dark > 0) {
      lctx.globalCompositeOperation = 'source-over';
      lctx.clearRect(0, 0, VW, VH);
      lctx.fillStyle = `rgba(8,12,36,${dark})`; lctx.fillRect(0, 0, VW, VH);
      lctx.globalCompositeOperation = 'destination-out';
      const R = Backpack.has(p.backpack, 'flashlight') ? CONFIG.LIGHT_RADIUS_FLASHLIGHT : CONFIG.LIGHT_RADIUS;
      const lx = p.x - camX, ly = p.y - 10 - camY;
      const g = lctx.createRadialGradient(lx, ly, R * 0.25, lx, ly, R);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g; lctx.fillRect(0, 0, VW, VH);
      c.drawImage(lightCanvas, 0, 0);
    }
  }
  return [camX, camY];
}

// ---------- Camp rendering ----------
const CampProps = {
  tent(c, x, y) {
    c.fillStyle = 'rgba(0,0,0,0.22)'; c.fillRect(x - 17, y - 1, 34, 3);
    for (let i = 0; i < 20; i++) {
      const w = Math.round(i * 0.85) + 1;
      c.fillStyle = '#d9783a'; c.fillRect(x - w, y - 20 + i, w * 2, 1);
      c.fillStyle = '#b85e28'; c.fillRect(x - w, y - 20 + i, w, 1);
    }
    for (let i = 7; i < 20; i++) { const w = Math.round((i - 7) * 0.45) + 1; c.fillStyle = '#3a2418'; c.fillRect(x - w, y - 20 + i, w * 2, 1); }
    c.fillStyle = '#6b4528'; c.fillRect(x - 1, y - 23, 2, 4);
  },
  campfire(c, x, y, time) {
    blob(c, x, y - 4, 13, 'rgba(255,170,70,0.12)');
    c.fillStyle = '#7d7f86';
    for (const [sx, sy] of [[-7, -2], [-4, 0], [1, 0], [5, -2], [-6, -5], [4, -5]]) c.fillRect(x + sx, y + sy, 3, 2);
    c.fillStyle = '#6b4528'; c.fillRect(x - 5, y - 3, 10, 2); c.fillStyle = '#4e321c'; c.fillRect(x - 2, y - 5, 4, 4);
    const f = Math.sin(time * 11) * 1.5, g = Math.cos(time * 7);
    c.fillStyle = '#e8562a'; c.fillRect(x - 3, y - 9 - Math.round(f), 6, 6 + Math.round(f));
    c.fillStyle = '#f5a623'; c.fillRect(x - 2, y - 8 - Math.round(g), 4, 5 + Math.round(g));
    c.fillStyle = '#fff2a8'; c.fillRect(x - 1, y - 6, 2, 3);
  },
  board(c, x, y) {
    c.fillStyle = '#6b4528'; c.fillRect(x - 8, y - 14, 2, 14); c.fillRect(x + 6, y - 14, 2, 14);
    c.fillStyle = '#8a5a30'; c.fillRect(x - 10, y - 20, 20, 12);
    c.fillStyle = '#f4ecd8'; c.fillRect(x - 8, y - 18, 5, 6); c.fillRect(x + 2, y - 18, 5, 4);
    c.fillStyle = '#f2c94c'; c.fillRect(x - 2, y - 17, 4, 6);
  },
  mailbox(c, x, y) {
    c.fillStyle = '#6b4528'; c.fillRect(x - 1, y - 9, 2, 9);
    c.fillStyle = '#c0392b'; c.fillRect(x - 5, y - 15, 10, 7);
    c.fillStyle = '#8e2a20'; c.fillRect(x - 5, y - 9, 10, 1);
    c.fillStyle = '#f2c94c'; c.fillRect(x + 5, y - 16, 1, 5); c.fillRect(x + 6, y - 16, 2, 2);
  },
  trailSign(c, x, y) {
    c.fillStyle = '#6b4528'; c.fillRect(x - 1, y - 12, 2, 12);
    c.fillStyle = '#4f7a3a'; c.fillRect(x - 8, y - 18, 14, 7);
    c.fillStyle = '#4f7a3a'; c.fillRect(x + 6, y - 17, 1, 5); c.fillRect(x + 7, y - 16, 1, 3);
    c.fillStyle = '#f4ecd8'; c.fillRect(x - 5, y - 15, 8, 1); c.fillRect(x + 1, y - 16, 1, 3);
  },
  plot(c, x, y, pl, time) { // x, y = tile top-left on screen
    c.fillStyle = pl.watered ? '#4a321e' : '#6b4a2e'; c.fillRect(x + 1, y + 1, 14, 14);
    c.fillStyle = pl.watered ? '#3a2616' : '#5a3d24'; c.fillRect(x + 2, y + 5, 12, 1); c.fillRect(x + 2, y + 10, 12, 1);
    if (!pl.cropId) return;
    const crop = CROPS[pl.cropId], cx = x + 8, cy = y + 12;
    const stage = pl.grown >= crop.days ? 3 : pl.grown === 0 ? 0 : pl.grown < crop.days / 2 ? 1 : 2;
    const sway = Math.sin(time * 2 + x) > 0.8 ? 1 : 0;
    if (stage === 0) { c.fillStyle = '#c8a878'; c.fillRect(cx - 1, cy - 2, 2, 2); c.fillStyle = crop.leaf; c.fillRect(cx, cy - 3, 1, 1); }
    if (stage === 1) { c.fillStyle = crop.leaf; c.fillRect(cx, cy - 5, 1, 4); c.fillRect(cx - 2 + sway, cy - 5, 2, 1); c.fillRect(cx + 1 + sway, cy - 4, 2, 1); }
    if (stage >= 2) { blob(c, cx + sway, cy - 5, stage === 2 ? 3 : 5, crop.leaf); c.fillStyle = '#5aa64a'; c.fillRect(cx - 1 + sway, cy - 7, 1, 1); }
    if (stage === 3) {
      c.fillStyle = crop.fruit;
      for (const [fx, fy] of [[-3, -6], [2, -8], [1, -3], [-2, -2], [3, -5]]) c.fillRect(cx + fx + sway, cy + fy, 2, 2);
      if (Math.sin(time * 4 + x) > 0.7) { c.fillStyle = '#fff'; c.fillRect(cx + 4, cy - 11, 1, 1); }
    }
  },
  furniture(c, id, x, y, time) {
    switch (id) {
      case 'wood_bench': Props.bench(c, x, y); break;
      case 'flower_pot':
        c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 5, y - 1, 10, 2);
        c.fillStyle = '#b8643a'; c.fillRect(x - 4, y - 6, 8, 6); c.fillStyle = '#9a4e2a'; c.fillRect(x - 4, y - 6, 8, 1);
        blob(c, x, y - 9, 4, '#3f8a3a');
        c.fillStyle = '#e88aa8'; c.fillRect(x - 3, y - 12, 2, 2); c.fillStyle = '#f2c94c'; c.fillRect(x + 1, y - 11, 2, 2); c.fillStyle = '#f4ecd8'; c.fillRect(x - 1, y - 14, 2, 2);
        break;
      case 'lantern':
        blob(c, x, y - 12, 9, `rgba(255,210,120,${0.14 + 0.05 * Math.sin(time * 3)})`);
        c.fillStyle = '#3a3a3a'; c.fillRect(x - 1, y - 12, 2, 12); c.fillRect(x - 1, y - 14, 5, 1);
        c.fillStyle = '#ffcf5a'; c.fillRect(x + 2, y - 13, 3, 4); c.fillStyle = '#fff2a8'; c.fillRect(x + 3, y - 12, 1, 2);
        break;
      case 'hammock':
        c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x - 10, y - 1, 20, 2);
        c.fillStyle = '#6b4528'; c.fillRect(x - 11, y - 14, 2, 14); c.fillRect(x + 9, y - 14, 2, 14);
        for (let i = 0; i < 18; i++) { c.fillStyle = i % 4 < 2 ? '#3b7dd8' : '#e8a33d'; c.fillRect(x - 9 + i, y - 11 + Math.round(Math.sin(i / 17 * Math.PI) * 4), 1, 2); }
        break;
      case 'rock_garden':
        blob(c, x - 3, y - 4, 4, '#7d7f86'); blob(c, x + 3, y - 3, 3, '#9a9ca2'); blob(c, x - 3, y - 6, 2, '#4f8a3c');
        c.fillStyle = '#e88aa8'; c.fillRect(x + 5, y - 7, 1, 1); c.fillStyle = '#f4ecd8'; c.fillRect(x - 6, y - 2, 1, 1);
        break;
    }
  },
};

function renderCamp() {
  const c = wctx, CWp = CAMP.W * TS, CHp = CAMP.H * TS, p = state.cp;
  c.imageSmoothingEnabled = false;
  const fx = p ? p.x : CWp / 2, fy = p ? p.y - 10 : CHp / 2;
  const camX = Math.round(CWp <= VW ? (CWp - VW) / 2 : clamp(fx - VW / 2, 0, CWp - VW));
  const camY = Math.round(CHp <= VH ? (CHp - VH) / 2 : clamp(fy - VH / 2, 0, CHp - VH));
  state.cam = [camX, camY];
  const time = performance.now() / 1000;
  c.fillStyle = '#1f3a28'; c.fillRect(0, 0, VW, VH);
  c.drawImage(Camp.ground, -camX, -camY);
  for (const pl of profile.camp.plots) CampProps.plot(c, pl.x * TS - camX, pl.y * TS - camY, pl, time);
  const list = [];
  for (const tr of Camp.trees) list.push({ y: tr.y, draw: () => {
    const spr = Assets.trees[tr.type][tr.v], x = tr.x - camX, y = tr.y - camY;
    c.fillStyle = 'rgba(0,0,0,0.22)'; c.fillRect(x - spr.w / 2 + 3, y - 2, spr.w - 6, 3);
    c.drawImage(spr.trunk, x - spr.w / 2, y - spr.h + 1);
    c.drawImage(spr.canopy, x - spr.w / 2 + Math.round(Math.sin(time * 1.4 + tr.phase) * 0.8), y - spr.h + 1);
  } });
  for (const f of CAMP.fixed) {
    const x = f.x * TS + (f.type === 'tent' ? 16 : 8) - camX, y = f.y * TS + 15 - camY;
    list.push({ y: f.y * TS + 15, draw: () => CampProps[f.type](c, x, y, time) });
  }
  for (const o of profile.camp.placed) list.push({ y: o.y * TS + 14, draw: () => CampProps.furniture(c, o.itemId, o.x * TS + 8 - camX, o.y * TS + 14 - camY, time) });
  if (p) list.push({ y: p.y, draw: () => Mini.draw(c, Math.round(p.x - camX), Math.round(p.y - camY), currentLook(), p.dir, p.frame, 1) });
  list.sort((a, b) => a.y - b.y);
  for (const d of list) d.draw();
  if (p && state.build && state.screen === 'camp') {
    const [x, y] = Camp.cursor(), ok = Camp.canPlace(x, y) || !!Camp.placedAt(x, y);
    c.strokeStyle = ok ? 'rgba(155,211,90,0.95)' : 'rgba(230,80,70,0.95)'; c.lineWidth = 1;
    c.strokeRect(x * TS - camX + 0.5, y * TS - camY + 0.5, TS - 1, TS - 1);
  }
  c.fillStyle = 'rgba(255,170,90,0.08)'; c.fillRect(0, 0, VW, VH); // warm evening camp tone
}

const FONT = 'Mitr, "Noto Sans Thai", Tahoma, sans-serif';
function panel(c, x, y, w, h, alpha = 0.78) {
  c.fillStyle = `rgba(18,28,22,${alpha})`;
  c.beginPath(); c.roundRect(x, y, w, h, 10); c.fill();
  c.strokeStyle = 'rgba(232,217,168,0.35)'; c.lineWidth = 1.5; c.stroke();
}
function text(c, s, x, y, size = 15, color = '#f4ecd8', align = 'left', weight = 400) {
  c.font = `${weight} ${size}px ${FONT}`; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle';
  c.fillText(s, x, y);
}
function bar(c, x, y, w, v, max, color, label) {
  text(c, label, x, y + 6, 13, '#e8dcc0');
  const bx = x + 52;
  c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.roundRect(bx, y, w, 12, 6); c.fill();
  if (v > 0) { c.fillStyle = color; c.beginPath(); c.roundRect(bx, y, Math.max(6, w * v / 100), 12, 6); c.fill(); }
  if (max < 100) { c.fillStyle = 'rgba(200,60,60,0.5)'; c.fillRect(bx + w * max / 100, y, w * (1 - max / 100), 12); }
  text(c, Math.ceil(v), bx + w + 8, y + 6, 12, '#e8dcc0');
}

function renderHUD(cam) {
  const c = hctx, IW = innerWidth, IH = innerHeight;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, IW, IH);
  if (state.screen === 'title') return renderTitle(c, IW, IH);
  if (state.screen === 'pack') return renderPack(c, IW, IH);
  if (state.screen === 'camp') return renderCampHUD(c, IW, IH);
  const p = state.player;
  const time = performance.now() / 1000;

  if (state.screen === 'play' && !state.dialog) drawTitleTag(c, p);
  // Stats
  panel(c, 14, 14, 250, 150);
  const low = v => v < 25 && Math.sin(time * 8) > 0;
  bar(c, 28, 28, 150, p.stamina, p.thirst <= 0 ? 50 : 100, p.exhausted ? '#c0504d' : '#9bd35a', t('stamina'));
  bar(c, 28, 50, 150, p.hunger, 100, low(p.hunger) ? '#ffd27a' : '#e8a33d', t('hunger'));
  bar(c, 28, 72, 150, p.thirst, 100, low(p.thirst) ? '#a8dcff' : '#4aa3e0', t('thirst'));
  bar(c, 28, 94, 150, p.warmth, 100, p.warmth < 30 ? (low(p.warmth) ? '#cfe8ff' : '#7fb2e5') : '#f08a5d', t('warmth'));
  const kg = Backpack.weight(p.backpack), over = kg > CONFIG.MAX_WEIGHT_KG;
  text(c, `🎒 ${kg.toFixed(1)}/${CONFIG.MAX_WEIGHT_KG} kg · ${p.backpack.slots.length}/${CONFIG.MAX_SLOTS} ${t('slots')}`, 28, 122, 12.5, over ? '#ff9a8a' : '#f4ecd8');
  text(c, t('walked', { d: (p.dist * TRAIL.realData.distanceKm / World.pathLenPx).toFixed(1) }), 28, 144, 12.5, '#cfc3a6');

  // Hotbar
  const narrow = IW < 700;
  const slotN = CONFIG.MAX_SLOTS, sz = Math.min(46, (IW - 40) / slotN - 4), hbW = slotN * (sz + 4) + 8, hbX = IW / 2 - hbW / 2, hbY = IH - sz - 44;
  state.hotbarHit = { x0: hbX + 6, y: hbY, sz, step: sz + 4, n: slotN };
  panel(c, hbX, hbY - 4, hbW, sz + 8, 0.8);
  const keyLabel = i => i < 9 ? String(i + 1) : ['0', '-', '='][i - 9];
  for (let i = 0; i < slotN; i++) {
    const x = hbX + 6 + i * (sz + 4), s = p.backpack.slots[i];
    c.fillStyle = 'rgba(255,255,255,0.08)'; c.beginPath(); c.roundRect(x, hbY, sz, sz, 6); c.fill();
    if (s) {
      const worn = Object.values(p.wearing).includes(s.itemId);
      if (worn) { c.strokeStyle = '#9bd35a'; c.lineWidth = 2; c.stroke(); }
      c.globalAlpha = s.itemId === 'water_bottle' && !s.full ? 0.35 : 1;
      text(c, ITEMS[s.itemId].icon, x + sz / 2, hbY + sz / 2 + 1, sz * 0.5, '#fff', 'center');
      c.globalAlpha = 1;
      const count = s.qty > 1 ? s.qty : s.charges ? s.charges : '';
      if (count) text(c, String(count), x + sz - 4, hbY + sz - 8, 11, '#fff', 'right', 600);
    }
    text(c, keyLabel(i), x + 4, hbY + 8, 10, 'rgba(244,236,216,0.6)');
  }

  // Clock + weather + minimap
  const mmS = narrow ? 1.6 : 3, mmW = W * mmS, mmH = H * mmS, mmX = IW - mmW - 18, mmY = 58;
  panel(c, mmX - 8, 14, mmW + 16, mmH + 56);
  const icon = { clear: '☀️', fog: '🌫️', drizzle: '🌦️' }[state.weather];
  text(c, narrow ? `${Time.label()} ${icon} ${Math.round(Climate.ambientC())}°C` : `🕒 ${Time.label()}  ${icon} ${t('w_' + state.weather)}  🌡️ ${Math.round(Climate.ambientC())}°C`, mmX + mmW / 2, 36, narrow ? 12 : 13.5, '#f4ecd8', 'center', 600);
  const evIcons = { slippery: '⚠️', coldWind: '🌬️', fogRoll: '🌫️', wildlife: '🦌' };
  state.activeEvents.forEach((a, i) => text(c, evIcons[a.id] || '•', mmX + mmW - 10 - i * 22, mmY + mmH + 14, 14, '#fff', 'center'));
  c.fillStyle = '#0e1612'; c.fillRect(mmX, mmY, mmW, mmH);
  c.imageSmoothingEnabled = false;
  c.drawImage(World.miniVis, mmX, mmY, mmW, mmH);
  const dot = (tx, ty, color, r = 3) => { c.fillStyle = color; c.beginPath(); c.arc(mmX + tx * mmS + mmS / 2, mmY + ty * mmS + mmS / 2, r, 0, 7); c.fill(); };
  for (const poi of TRAIL.pois) {
    const known = poi.type === 'viewpoint' || poi.type === 'goal' || World.revealed[poi.y * W + poi.x];
    if (!known || poi.type === 'secret' || ((poi.type === 'item' || poi.type === 'photo') && state.done[poi.id])) continue;
    dot(poi.x, poi.y, poi.type === 'viewpoint' ? '#4fc3f7' : poi.type === 'goal' ? '#e74c3c' : '#f4ecd8', 2.5);
  }
  dot(p.x / TS - 0.5, p.y / TS - 0.5, '#fff', 3.5); dot(p.x / TS - 0.5, p.y / TS - 0.5, currentLook().shirt, 2.2);

  // Compass / objective
  const toCheckpoint = TRAIL.checkpointId && !state.checkpoint;
  const target = TRAIL.pois.find(q => q.id === (toCheckpoint ? TRAIL.checkpointId : TRAIL.goalId));
  const ddx = target.x * TS + 8 - p.x, ddy = target.y * TS + 8 - p.y;
  const ang = Math.atan2(ddy, ddx);
  const meters = Math.round(Math.hypot(ddx, ddy) * TRAIL.realData.distanceKm * 1000 / World.pathLenPx);
  const objText = t(toCheckpoint ? TRAIL.objKeys.checkpoint : TRAIL.objKeys.goal) + ` · ${meters} m`;
  c.font = `600 15px ${FONT}`;
  const ow = c.measureText(objText).width + 70;
  const oy = narrow ? 172 : 14, ox = narrow ? 14 : IW / 2 - ow / 2;
  panel(c, ox, oy, ow, 40);
  c.save(); c.translate(ox + 24, oy + 20); c.rotate(ang);
  c.fillStyle = toCheckpoint ? '#4fc3f7' : '#e74c3c';
  c.beginPath(); c.moveTo(11, 0); c.lineTo(-7, -7); c.lineTo(-3, 0); c.lineTo(-7, 7); c.closePath(); c.fill();
  c.restore();
  text(c, objText, ox + 44, oy + 20, 15, '#f4ecd8', 'left', 600);

  drawToasts(c, IW, narrow ? 222 : 64);

  // Interaction prompt / dialog
  if (state.dialog) {
    const dw = Math.min(640, IW - 40), dx = IW / 2 - dw / 2, dy = hbY - 112;
    panel(c, dx, dy, dw, 100, 0.9);
    text(c, t('guide_name'), dx + 20, dy + 22, 14, '#9bd35a', 'left', 600);
    wrapText(c, state.dialog.lines[state.dialog.i], dx + 20, dy + 50, dw - 40, 16, 22);
    text(c, t('dialog_next') + ` (${state.dialog.i + 1}/${state.dialog.lines.length})`, dx + dw - 20, dy + 84, 12, '#cfc3a6', 'right');
  } else if (state.screen === 'play') {
    const tg = Interact.find();
    if (tg) {
      const s = `[E] ${tg.label}`;
      c.font = `600 16px ${FONT}`;
      const w = c.measureText(s).width + 36;
      panel(c, IW / 2 - w / 2, hbY - 52, w, 38, 0.88);
      text(c, s, IW / 2, hbY - 33, 16, '#ffe9a8', 'center', 600);
    }
  }
  text(c, t('controls'), 16, IH - 18, 12, 'rgba(244,236,216,0.75)');

  if (p.zeroTimer > 0) {
    c.fillStyle = `rgba(160,20,20,${0.15 + 0.1 * Math.sin(time * 6)})`; c.fillRect(0, 0, IW, IH);
  }
  if (state.flash > 0) { c.fillStyle = `rgba(255,255,255,${state.flash})`; c.fillRect(0, 0, IW, IH); }

  if (state.screen === 'summary') renderSummary(c, IW, IH);
  if (state.screen === 'rescue') renderRescue(c, IW, IH);
}

function wrapText(c, s, x, y, maxW, size, lh) {
  c.font = `400 ${size}px ${FONT}`;
  // Thai has no spaces between words, so wrap by character when needed.
  const tokens = s.includes(' ') ? s.split(/(\s+)/) : Array.from(s);
  let line = '', yy = y;
  for (const tk of tokens) {
    const test = line + tk;
    if (c.measureText(test).width > maxW && line) { text(c, line.trim(), x, yy, size); line = tk.trimStart(); yy += lh; }
    else line = test;
  }
  if (line) text(c, line.trim(), x, yy, size);
}

// ---------- Character creator (title screen) ----------
const TitleScene = {
  canvas: null, w: 0, h: 0, S: 4,
  build(IW, IH) {
    const S = this.S, w = Math.ceil(IW / S), h = Math.ceil(IH / S);
    if (this.canvas && this.w === w && this.h === h) return;
    this.w = w; this.h = h;
    const cv = this.canvas = makeCanvas(w, h), c = cv.getContext('2d'), rng = mulberry32(42);
    const hz = Math.round(h * 0.56);
    for (let y = 0; y < hz; y++) { // sky
      const k = y / hz, mix = (a, b) => Math.round(a + (b - a) * k);
      c.fillStyle = `rgb(${mix(104, 206)},${mix(176, 234)},${mix(228, 242)})`; c.fillRect(0, y, w, 1);
    }
    c.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 6; i++) { const cx = Math.floor(rng() * w), cy = Math.floor(rng() * h * 0.25) + 4; blob(c, cx, cy, 3 + Math.floor(rng() * 3), '#f4fbff'); blob(c, cx + 5, cy + 1, 3, '#ffffff'); blob(c, cx - 5, cy + 2, 2, '#eaf6fb'); }
    const ridge = (base, amp, f1, f2, col, phase) => { c.fillStyle = col; for (let x = 0; x < w; x++) { const top = Math.round(base - amp * (0.6 * Math.sin(x * f1 + phase) + 0.4 * Math.sin(x * f2 + phase * 2))); c.fillRect(x, top, 1, hz + 8 - top); } };
    ridge(h * 0.33, h * 0.08, 0.045, 0.12, '#93b4c8', 1.2);
    ridge(h * 0.42, h * 0.07, 0.06, 0.17, '#6f9a90', 2.6);
    ridge(h * 0.5, h * 0.04, 0.09, 0.23, '#4f8250', 0.4);
    for (let x = -4; x < w + 4; x += 3) { // tree line
      const ty = hz + Math.floor(rng() * 3), th = 6 + Math.floor(rng() * 6);
      if (rng() < 0.55) for (let r = 0; r < th; r++) { const hw = Math.round(r / th * 3) + 1; c.fillStyle = r % 3 ? '#2d5e3a' : '#356a48'; c.fillRect(x - hw, ty - th + r, hw * 2, 1); }
      else blob(c, x, ty - 3, 3 + Math.floor(rng() * 2), rng() < 0.5 ? '#3f7a3a' : '#2f6b2f');
    }
    c.fillStyle = '#6fa84a'; c.fillRect(0, hz + 1, w, h - hz);
    c.fillStyle = '#5a9040'; c.fillRect(0, Math.round(h * 0.86), w, h);
    for (let i = 0; i < w * 3; i++) { c.fillStyle = rng() < 0.5 ? '#88c05a' : '#4f8a3c'; c.fillRect(Math.floor(rng() * w), hz + 2 + Math.floor(rng() * (h - hz)), 1, 1); }
    for (let y = hz + 2; y < h; y++) { // dirt path toward the viewer
      const k = (y - hz) / (h - hz), cx = w * 0.44 + Math.sin(y * 0.09) * w * 0.04, hw = 2 + k * w * 0.09;
      c.fillStyle = '#c8a878'; c.fillRect(Math.round(cx - hw), y, Math.round(hw * 2), 1);
      if (rng() < 0.4) { c.fillStyle = '#b89466'; c.fillRect(Math.round(cx - hw + rng() * hw * 2), y, 1, 1); }
    }
    // tent at left, trail sign in the middle
    const tx = Math.round(w * 0.06), tyb = Math.round(h * 0.72);
    for (let i = 0; i < 14; i++) { const hw = Math.round(i * 0.9) + 1; c.fillStyle = '#d8c8a0'; c.fillRect(tx - hw, tyb - 14 + i, hw * 2, 1); c.fillStyle = '#c0b088'; c.fillRect(tx - hw, tyb - 14 + i, hw, 1); }
    for (let i = 6; i < 14; i++) { const hw = Math.round((i - 6) * 0.4) + 1; c.fillStyle = '#5a4a32'; c.fillRect(tx - hw, tyb - 14 + i, hw * 2, 1); }
    const sx = Math.round(w * 0.4), sy = Math.round(h * 0.62);
    c.fillStyle = '#6b4528'; c.fillRect(sx, sy - 6, 1, 7); c.fillStyle = '#9a6a3a'; c.fillRect(sx - 3, sy - 7, 7, 3);
  },
  // poleX = screen x of the flag pole (kept clear of the side panel)
  draw(c, IW, IH, time, poleX) {
    this.build(IW, IH);
    c.imageSmoothingEnabled = false;
    c.drawImage(this.canvas, 0, 0, this.w * this.S, this.h * this.S);
    const S = this.S, px = Math.round(poleX / S), top = Math.round(Math.max(this.h * 0.12, 180 / S)), base = Math.round(this.h * 0.62);
    c.fillStyle = '#9a9ca2'; c.fillRect(px * S, top * S, S, (base - top) * S); c.fillStyle = '#d8b26a'; c.fillRect((px - 1) * S, (top - 1) * S, 3 * S, S);
    const fx = (px + 1) * S, fy = (top + 1) * S;
    const stripe = j => j < 2 || j >= 10 ? '#d8243a' : j < 4 || j >= 8 ? '#f4f4f4' : '#2a2f7a'; // Thai flag 1:1:2:1:1
    for (let i = 0; i < 18; i++) {
      const off = Math.round(Math.sin(time * 3 - i * 0.45) * (i / 18) * 1.6);
      for (let j = 0; j < 12; j++) { c.fillStyle = stripe(j); c.fillRect(fx + i * S, fy + (j + off) * S, S, S); }
    }
  },
};

  const start = clamp(m.sel - maxRows + 1, 0, Math.max(0, rows.length - maxRows));
  const pw = Math.min(640, IW - 32), ph = 96 + shown * rh, px = IW / 2 - pw / 2, py = state.touch ? 16 : Math.max(16, IH / 2 - ph / 2);
  c.fillStyle = 'rgba(10,20,14,0.45)'; c.fillRect(0, 0, IW, IH);
  panel(c, px, py, pw, ph, 0.94);
  text(c, t(title), px + 20, py + 28, 19, '#ffe9a8', 'left', 600);
  if (m.type === 'shop') text(c, `🪙 ${profile.coins}`, px + pw - 20, py + 28, 16, '#f2c94c', 'right', 600);
  if (m.type === 'skills') text(c, t('skill_points', { n: Skills.points() }), px + pw - 20, py + 28, 15, '#9bd35a', 'right', 600);
  if (m.type === 'journal') {
    const right = m.tab === 'album' ? t('album_count', { n: profile.album.length, m: Object.keys(PHOTO_SUBJECTS).length }) + '   ' : '';
    text(c, right + JOURNAL_TABS.map(tb => tb === m.tab ? '●' : '○').join(' '), px + pw - 20, py + 28, 14, '#cfe3b8', 'right', 600);
  }
  if (start > 0) text(c, '▲', px + pw / 2, py + 44, 11, '#cfc3a6', 'center');
  if (start + shown < rows.length) text(c, '▼', px + pw / 2, py + ph - 34, 11, '#cfc3a6', 'center');
  state.menuHit = [];
  rows.slice(start, start + shown).forEach((r, j) => {
    const i = start + j, y = py + 66 + j * rh, sel = m.sel === i && m.type !== 'quests';
    state.menuHit.push({ x: px + 12, y: y - 19, w: pw - 24, h: rh - 4, i });
    if (sel) { c.fillStyle = 'rgba(255,233,168,0.12)'; c.beginPath(); c.roundRect(px + 12, y - 19, pw - 24, rh - 4, 8); c.fill(); }
    c.globalAlpha = r.enabled ? 1 : 0.5;
    if (r.medal) { // unique medal emblem: ribbon + colored disc + ring
      const mx = px + 32, md = r.medal;
      c.fillStyle = r.got ? '#c0392b' : '#555'; c.fillRect(mx - 9, y - 21, 7, 10); c.fillStyle = r.got ? '#2a5d8a' : '#444'; c.fillRect(mx + 2, y - 21, 7, 10);
      c.fillStyle = r.got ? md.ring : '#777'; c.beginPath(); c.arc(mx, y + 2, 15, 0, 7); c.fill();
      c.fillStyle = r.got ? md.color : '#4a4a4a'; c.beginPath(); c.arc(mx, y + 2, 12, 0, 7); c.fill();
      if (!r.got) c.globalAlpha = 0.35;
      text(c, r.icon, mx, y + 3, 13, '#fff', 'center');
      c.globalAlpha = r.enabled ? 1 : 0.5;
    } else
    text(c, r.icon, px + 32, y, 20, '#fff', 'center');
    text(c, r.label, px + 54, y - 8, 14.5, sel ? '#ffe9a8' : '#f4ecd8', 'left', sel ? 600 : 400);
    text(c, r.sub, px + 54, y + 10, 11.5, '#cfc3a6');
    text(c, r.right, px + pw - 24, y, 12.5, '#cfe3b8', 'right');
    c.globalAlpha = 1;
  });
  const hint = m.type === 'journal' && m.tab === 'titles' ? 'titles_hint'
    : { quests: 'menu_hint_q', skills: 'skill_hint', journal: 'journal_hint', trails: 'trails_hint' }[m.type] || 'menu_hint';
  text(c, t(hint), IW / 2, py + ph - 16, 12.5, '#ffe9a8', 'center');
}

function renderPack(c, IW, IH) {
  c.fillStyle = 'rgba(10,20,14,0.6)'; c.fillRect(0, 0, IW, IH);
  const ids = packIds();
  const pw = Math.min(680, IW - 32), ph = 120 + ids.length * 42 + 70, px = IW / 2 - pw / 2, py = Math.max(16, IH / 2 - ph / 2);
  panel(c, px, py, pw, ph, 0.9);
  text(c, '🎒 ' + t('pack_title'), IW / 2, py + 34, 24, '#ffe9a8', 'center', 600);
  const icon = { clear: '☀️', fog: '🌫️', drizzle: '🌦️' }[state.weather];
  text(c, `${t('forecast')}: ${icon} ${t('w_' + state.weather)} · ${t('tip_' + state.weather)}`, IW / 2, py + 64, 13, '#a8dcff', 'center');
  ids.forEach((id, i) => {
    const y = py + 104 + i * 42, sel = state.packRow === i, def = ITEMS[id], n = Math.min(profile.pack[id] || 0, packMax(id));
    if (sel) { c.fillStyle = 'rgba(255,233,168,0.12)'; c.beginPath(); c.roundRect(px + 16, y - 18, pw - 32, 38, 8); c.fill(); }
    text(c, def.icon, px + 36, y, 20, '#fff', 'center');
    text(c, t('item_' + id), px + 58, y - 7, 15, sel ? '#ffe9a8' : '#f4ecd8', 'left', sel ? 600 : 400);
    text(c, t('tip_' + id), px + 58, y + 11, 11.5, '#cfc3a6');
    text(c, `◂ ${n}/${packMax(id)} ▸`, px + pw - 120, y, 15, n ? '#f4ecd8' : '#8a8270', 'center', 600);
    if (COOKED.includes(id)) text(c, t('from_camp'), px + pw - 190, y, 11, '#9bd35a', 'right');
    text(c, (def.weightKg * n).toFixed(1) + ' kg', px + pw - 32, y, 13, '#cfc3a6', 'right');
  });
  const kg = Backpack.packWeight(profile.pack), over = kg > CONFIG.MAX_WEIGHT_KG, by = py + ph - 62;
  const bw = pw - 64;
  c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.roundRect(px + 32, by, bw, 12, 6); c.fill();
  c.fillStyle = over ? '#e06050' : '#9bd35a'; c.beginPath(); c.roundRect(px + 32, by, Math.max(6, Math.min(1, kg / CONFIG.MAX_WEIGHT_KG) * bw), 12, 6); c.fill();
  text(c, `${t('weight')} ${kg.toFixed(1)}/${CONFIG.MAX_WEIGHT_KG} kg · ${Backpack.packSlots(profile.pack)}/${CONFIG.MAX_SLOTS} ${t('slots')} · ${over ? t('pack_over') : t('pack_ok')}`,
       IW / 2, by + 26, 13, over ? '#ff9a8a' : '#cfe3b8', 'center');
  text(c, t('pack_hint'), IW / 2, py + ph - 14, 13, '#ffe9a8', 'center');
}

function renderSummary(c, IW, IH) {
  const s = state.summary;
  c.fillStyle = 'rgba(10,20,14,0.6)'; c.fillRect(0, 0, IW, IH);
  const pw = Math.min(600, IW - 32), ph = 440, px = IW / 2 - pw / 2, py = Math.max(8, IH / 2 - ph / 2);
  panel(c, px, py, pw, ph, 0.92);
  text(c, '🏅 ' + t('sum_title'), IW / 2, py + 38, 26, '#ffe9a8', 'center', 600);
  // Stamp
  const sx = px + 130, sy = py + 200;
  c.save(); c.translate(sx, sy); c.rotate(-0.15);
  c.strokeStyle = '#c0392b'; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 88, 0, 7); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 76, 0, 7); c.stroke();
  text(c, t(TRAIL.stampKeys[0]), 0, -40, 15, '#c0392b', 'center', 600);
  c.fillStyle = '#c0392b';
  c.beginPath(); c.moveTo(-40, 14); c.lineTo(-12, -22); c.lineTo(4, -4); c.lineTo(18, -18); c.lineTo(42, 14); c.closePath(); c.fill();
  text(c, t(TRAIL.stampKeys[1]), 0, 34, 14, '#c0392b', 'center', 600);
  text(c, s.date, 0, 56, 12, '#c0392b', 'center');
  c.restore();
  // Stats
  const rows = [
    [t('sum_time'), s.time], [t('sum_clock'), s.clock], [t('sum_dist'), s.dist + ' km'],
    [t('sum_photos'), s.photos], [t('sum_litter'), s.litter], [t('sum_secret'), s.secret ? t('found') : t('notFound')],
    [t('sum_exp'), '+' + s.exp], [t('sum_coins'), '+' + s.coins + ' 🪙'], [t('sum_total'), `${profile.exp} (${t('lv')}${Level.info().level})`],
  ];
  rows.forEach(([k, v], i) => {
    const y = py + 90 + i * 32;
    text(c, k, px + 260, y, 15, '#e8dcc0');
    text(c, String(v), px + pw - 28, y, 15, i >= 6 ? '#9bd35a' : '#f4ecd8', 'right', 600);
  });
  text(c, t('sum_hint'), IW / 2, py + ph - 24, 14, '#ffe9a8', 'center');
}

function renderRescue(c, IW, IH) {
  c.fillStyle = 'rgba(10,20,14,0.7)'; c.fillRect(0, 0, IW, IH);
  const pw = Math.min(560, IW - 32), ph = 200, px = IW / 2 - pw / 2, py = IH / 2 - ph / 2;
  panel(c, px, py, pw, ph, 0.92);
  text(c, '🚑 ' + t('rescue_title'), IW / 2, py + 40, 20, '#ffb38a', 'center', 600);
  wrapText(c, t(state.rescueReason === 'cold' ? 'rescue_cold' : 'rescue_body'), px + 28, py + 90, pw - 56, 15, 22);
  text(c, t('rescue_hint'), IW / 2, py + ph - 28, 14, '#ffe9a8', 'center');
}

// ---------- Touch controls (phones/tablets) ----------
// Floating joystick on the left half, action buttons on the right. Buttons call handleKey(), so touch and keyboard share one code path.
const Touch = {
  stick: null, holds: {}, buttons: [], pressed: {},
  layout(IW, IH) {
    const B = [], s = state.screen, add = (id, x, y, r, label, opt = {}) => B.push({ id, x, y, r, label, ...opt });
    const rx = IW - 58, by = IH - 150;
    add('snd', IW - 26, IH - 24, 15, profile.sound === false ? '🔇' : '🔊', { code: 'KeyM' });
    add('mus', IW - 62, IH - 24, 15, profile.music === false ? '🚫' : '🎵', { code: 'KeyN' });
    const menuMode = s === 'pack' || (s === 'camp' && state.menu);
    if (menuMode) {
      add('up', rx - 52, by - 58, 24, '▲', { code: 'ArrowUp' }); add('down', rx - 52, by + 30, 24, '▼', { code: 'ArrowDown' });
      add('left', rx - 100, by - 14, 24, '◀', { code: 'ArrowLeft' }); add('right', rx - 4, by - 14, 24, '▶', { code: 'ArrowRight' });
      add('ok', 64, by + 10, 30, 'OK', { code: 'Enter' });
      if (s !== 'title') add('back', 64, by - 66, 24, '✕', { code: 'Escape' });
      if (s === 'title') add('lang', 64, by - 66, 24, 'ก/A', { code: 'KeyL' });
    } else if (s === 'play' || s === 'camp') {
      add('act', rx, by + 16, 34, 'E', { code: 'KeyE' });
      add('run', rx - 78, by + 40, 26, '🏃', { hold: 'run' });
      if (s === 'camp') {
        if (state.build) {
          add('place', rx, by - 62, 24, '✔', { code: 'KeyE' }); add('pick', rx - 56, by - 62, 22, 'X', { code: 'KeyX' });
          add('next', rx - 108, by - 62, 22, '⟳', { code: 'BracketRight' }); add('bexit', rx - 160, by - 62, 22, '🔨', { code: 'KeyB' });
        } else {
          add('seed', rx, by - 62, 22, '🌱', { code: 'KeyQ' }); add('build', rx - 52, by - 62, 22, '🔨', { code: 'KeyB' });
          add('skills', rx - 104, by - 62, 22, '⭐', { code: 'KeyK' }); add('journal', rx - 156, by - 62, 22, '📖', { code: 'KeyJ' });
        }
      }
    }
    this.buttons = B;
    return B;
  },
  hitButton(x, y) { return this.buttons.find(b => Math.hypot(x - b.x, y - b.y) <= b.r + 6); },
  down(e) {
    const x = e.clientX, y = e.clientY, s = state.screen;
    const b = state.touch && this.hitButton(x, y);
    if (b) {
      this.pressed[e.pointerId] = b.id;
      if (b.hold) { vkeys[b.hold] = true; this.holds[e.pointerId] = b.hold; }
      else handleKey(b.code);
      return;
    }
    if (s === 'summary' || s === 'rescue') { handleKey('Enter'); return; }
    if (s === 'title' && state.titleHit) {
      const h = state.titleHit.find(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
      if (h) h.fn();
      if (document.activeElement === nameInput) nameInput.blur();
      return;
    }
    if (s === 'camp' && state.menu && state.menuHit) {
      const r = state.menuHit.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
      if (r) { if (state.menu.sel === r.i) handleKey('Enter'); else { state.menu.sel = r.i; Sound.sfx('blip'); } return; }
    }
    const hb = state.hotbarHit;
    if (s === 'play' && hb && y >= hb.y && y <= hb.y + hb.sz && x >= hb.x0 && x < hb.x0 + hb.step * hb.n) {
      Backpack.use(Math.floor((x - hb.x0) / hb.step)); return;
    }
    if (state.touch && (s === 'play' || (s === 'camp' && !state.menu)) && x < innerWidth * 0.55 && !this.stick) {
      this.stick = { id: e.pointerId, x0: x, y0: y, x, y };
      this.updateStick();
    }
  },
  move(e) { if (this.stick && e.pointerId === this.stick.id) { this.stick.x = e.clientX; this.stick.y = e.clientY; this.updateStick(); } },
  up(e) {
    if (this.stick && e.pointerId === this.stick.id) { this.stick = null; vkeys.left = vkeys.right = vkeys.up = vkeys.down = false; vkeys.stickRun = false; this.syncRun(); }
    if (this.holds[e.pointerId]) { vkeys[this.holds[e.pointerId]] = false; delete this.holds[e.pointerId]; this.syncRun(); }
    delete this.pressed[e.pointerId];
  },
  updateStick() {
    const st = this.stick, dx = st.x - st.x0, dy = st.y - st.y0, len = Math.hypot(dx, dy);
    const nx = len > 12 ? dx / len : 0, ny = len > 12 ? dy / len : 0;
    vkeys.left = nx < -0.38; vkeys.right = nx > 0.38; vkeys.up = ny < -0.38; vkeys.down = ny > 0.38;
    vkeys.stickRun = len > 70; // push far to run
    this.syncRun();
  },
  syncRun() { vkeys.run = !!vkeys.stickRun || Object.values(this.holds).includes('run'); },
  render(c, IW, IH) {
    if (!state.touch) return;
    const B = this.layout(IW, IH), active = new Set(Object.values(this.pressed));
    for (const b of B) {
      c.fillStyle = active.has(b.id) ? 'rgba(255,233,168,0.45)' : 'rgba(18,28,22,0.55)';
      c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill();
      c.strokeStyle = 'rgba(232,217,168,0.5)'; c.lineWidth = 1.5; c.stroke();
      text(c, b.label, b.x, b.y + 1, b.r * 0.75, '#fff6dc', 'center', 600);
    }
    if (this.stick) {
      const st = this.stick, dx = st.x - st.x0, dy = st.y - st.y0, len = Math.hypot(dx, dy), k = len > 56 ? 56 / len : 1;
      c.fillStyle = 'rgba(18,28,22,0.35)'; c.beginPath(); c.arc(st.x0, st.y0, 56, 0, 7); c.fill();
      c.strokeStyle = 'rgba(232,217,168,0.4)'; c.stroke();
      c.fillStyle = vkeys.stickRun ? 'rgba(255,180,120,0.8)' : 'rgba(255,233,168,0.7)';
      c.beginPath(); c.arc(st.x0 + dx * k, st.y0 + dy * k, 24, 0, 7); c.fill();
    } else if (state.screen === 'play' || (state.screen === 'camp' && !state.menu)) {
      c.fillStyle = 'rgba(18,28,22,0.18)'; c.beginPath(); c.arc(96, IH - 150, 50, 0, 7); c.fill(); // joystick hint
      text(c, '✥', 96, IH - 150, 26, 'rgba(255,246,220,0.35)', 'center');
    }
  },
};
state.touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
hudCanvas.addEventListener('pointerdown', e => {
  Sound.init();
  if (e.pointerType === 'touch') state.touch = true;
  e.preventDefault();
  try { hudCanvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  Touch.down(e);
});
hudCanvas.addEventListener('pointermove', e => Touch.move(e));
hudCanvas.addEventListener('pointerup', e => Touch.up(e));
hudCanvas.addEventListener('pointercancel', e => Touch.up(e));
hudCanvas.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// 8. MAIN LOOP
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.screen === 'play') {
    state.time += dt;
    Player.update(dt, input());
    Bird.update(dt);
    Events.update(dt);
  }
  if (state.screen === 'camp') Camp.update(dt, input());
  if (state.screen === 'camp' || state.screen === 'play' || state.screen === 'summary') Achievements.update(dt);
  Sound.update(dt);
  for (const tt of state.toasts) tt.t -= dt;
  state.toasts = state.toasts.filter(tt => tt.t > 0);
  state.flash = Math.max(0, state.flash - dt * 3);
  if (state.weather === 'drizzle') for (const r of rain) { r.y += r.s * dt; r.x -= r.s * 0.15 * dt; if (r.y > VH) { r.y = -4; r.x = Math.random() * (VW + 40); } }
  const cam = (state.screen === 'camp' || state.screen === 'pack') ? renderCamp() : renderWorld();
  renderHUD(cam);
  if (state.screen !== 'title' && nameInput.style.display !== 'none') { nameInput.style.display = 'none'; nameInput.blur(); }
  Touch.render(hctx, innerWidth, innerHeight);
  requestAnimationFrame(frame);
}

Assets.build();
TRAIL = TRAILS.find(x => x.id === profile.lastTrail && trailUnlocked(x)) || TRAILS[0];
World.build();
Camp.build();
state.weather = rollWeather();
resize();
requestAnimationFrame(frame);
</script>

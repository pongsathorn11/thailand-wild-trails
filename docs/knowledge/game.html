// 3. ASSETS  (pixel art drawn with code)
// ============================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function blob(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.round(Math.sqrt(r * r - dy * dy));
    ctx.fillRect(cx - w, cy + dy, w * 2, 1);
  }
}

const Assets = {
  trees: { broad: [], pine: [] },
  build() {
    const rng = mulberry32(7);
    const broadPal = [['#2f6b2f', '#3f8a3a', '#5aa64a'], ['#2d6436', '#3c8044', '#58a055'], ['#35702c', '#4a9036', '#6cb050']];
    for (let v = 0; v < 3; v++) {
      const trunk = makeCanvas(26, 30), tc = trunk.getContext('2d');
      tc.fillStyle = '#6b4528'; tc.fillRect(11, 17, 4, 13);
      tc.fillStyle = '#4e321c'; tc.fillRect(11, 17, 1, 13);
      const canopy = makeCanvas(26, 24), cc = canopy.getContext('2d');
      const [d, m, l] = broadPal[v];
      blob(cc, 13, 12, 10, d);
      blob(cc, 10 + Math.floor(rng() * 3), 10, 7, m);
      blob(cc, 16, 9, 5, m);
      blob(cc, 9, 6, 3, l);
      cc.fillStyle = l;
      for (let i = 0; i < 8; i++) cc.fillRect(5 + Math.floor(rng() * 14), 3 + Math.floor(rng() * 10), 1, 1);
      this.trees.broad.push({ trunk, canopy, w: 26, h: 30 });
    }
    const pinePal = [['#2d5e3a', '#3f7a4a'], ['#2a573a', '#3a7048'], ['#305f34', '#467e44']];
    for (let v = 0; v < 3; v++) {
      const trunk = makeCanvas(18, 30), tc = trunk.getContext('2d');
      tc.fillStyle = '#5e3c22'; tc.fillRect(8, 21, 2, 9);
      const canopy = makeCanvas(18, 24), cc = canopy.getContext('2d');
      const [d, l] = pinePal[v];
      for (let i = 0; i < 4; i++) {
        const top = 1 + i * 5, hw = 3 + i * 2;
        for (let r = 0; r < 8; r++) {
          const w = Math.round((r / 7) * hw) + 1;
          cc.fillStyle = d; cc.fillRect(9 - w, top + r, w * 2, 1);
          cc.fillStyle = l; cc.fillRect(9 - w, top + r, w, 1);
        }
      }
      this.trees.pine.push({ trunk, canopy, w: 18, h: 30 });
    }
  },
};

// Hiker sprite. (x, y) = feet position. s = pixel size.
function drawHiker(ctx, x, y, look, dir, frame, s = 1) {
  const r = (px, py, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + px * s, y + py * s, w * s, h * s); };
  const step = [0, 1, 0, -1][frame % 4];
  const pants = look.pants || '#4a4f5e', boots = '#5a3a22', pack = look.packColor || '#c0582a', strap = '#8a3a1a';
  const hs = look.hairStyle || 'short';
  // hair that hangs behind the head (drawn before the face)
  if (hs === 'long') { if (dir === 'up') r(-3, -19, 6, 8, look.hair); else if (dir === 'left') r(0, -17, 3, 6, look.hair); else if (dir === 'right') r(-3, -17, 3, 6, look.hair); else { r(-4, -17, 1, 6, look.hair); r(3, -17, 1, 6, look.hair); } }
  const hatC = look.hatColor || '#e8d9a8';
  r(-5, -1, 10, 2, 'rgba(0,0,0,0.25)');
  const lL = step === 1 ? 1 : 0, rL = step === -1 ? 1 : 0;
  r(-3, -6, 2, 5 - lL, pants); r(-3, -1 - lL, 2, 1, boots);
  r(1, -6, 2, 5 - rL, pants);  r(1, -1 - rL, 2, 1, boots);
  if (look.pack !== false && dir === 'left') r(2, -13, 3, 7, pack);
  if (look.pack !== false && dir === 'right') r(-5, -13, 3, 7, pack);
  r(-4, -12, 8, 6, look.shirt);
  if (dir !== 'right') { r(-5, -12 + step, 1, 2, look.shirt); r(-5, -10 + step, 1, 3, look.skin); }
  if (dir !== 'left')  { r(4, -12 - step, 1, 2, look.shirt);  r(4, -10 - step, 1, 3, look.skin); }
  if (look.pack !== false) {
    if (dir === 'up') { r(-4, -13, 8, 7, pack); r(-3, -12, 6, 1, strap); }
    if (dir === 'down') { r(-3, -12, 1, 5, strap); r(2, -12, 1, 5, strap); }
  }
  r(-3, -18, 6, 6, look.skin);
  if (dir === 'up') r(-3, -19, 6, 6, look.hair);
  else {
    r(-3, -19, 6, 2, look.hair);
    if (dir === 'down') { r(-3, -17, 1, 2, look.hair); r(2, -17, 1, 2, look.hair); }
    if (dir === 'left') r(0, -17, 3, 3, look.hair);
    if (dir === 'right') r(-3, -17, 3, 3, look.hair);
  }
  if (dir === 'down') { r(-2, -15, 1, 1, '#222'); r(1, -15, 1, 1, '#222'); }
  if (dir === 'left') r(-2, -15, 1, 1, '#222');
  if (dir === 'right') r(1, -15, 1, 1, '#222');
  if (hs === 'spiky') { r(-3, -20, 1, 1, look.hair); r(-1, -20, 1, 1, look.hair); r(1, -20, 1, 1, look.hair); }
  if (hs === 'ponytail') { if (dir === 'left') r(3, -17, 2, 4, look.hair); else if (dir === 'right') r(-5, -17, 2, 4, look.hair); else if (dir === 'up') r(-1, -14, 2, 3, look.hair); else r(3, -17, 1, 3, look.hair); }
  if (hs === 'bun' && look.hat !== 'bucket' && look.hat !== 'cap') r(-1, -21, 2, 2, look.hair);
  if ((look.acc === 'glasses' || look.acc === 'sunglasses') && dir !== 'up') {
    const gc = look.acc === 'sunglasses' ? '#1a1a22' : '#444';
    if (dir === 'down') r(-3, -15, 6, 1, gc); else if (dir === 'left') r(-3, -15, 3, 1, gc); else r(0, -15, 3, 1, gc);
  }
  if (look.hat === 'cap') {
    r(-3, -20, 6, 2, hatC);
    if (dir === 'down') r(-3, -18, 6, 1, hatC);
    if (dir === 'left') r(-5, -19, 3, 1, hatC);
    if (dir === 'right') r(2, -19, 3, 1, hatC);
  } else if (look.hat === 'bucket') {
    r(-3, -21, 6, 2, hatC); r(-5, -19, 10, 1, hatC);
  }
}

// Large chibi portrait for the character creator: drawn at 1px per grid cell on a 40×58 canvas,

const Chibi = {

  key(look, frame, blink) { return [look.body, look.hairStyle, look.hair, look.skin, look.face, look.shirt, look.pants, look.packColor, look.acc, frame, blink].join('|'); },
  sprite(look, frame = 0, blink = false) {

    if (this.cache.has(k)) return this.cache.get(k);
    const base = makeCanvas(this.W, this.H), c = base.getContext('2d');
    this.paint(c, this.FX, this.FY, look, frame, blink);

    const sil = makeCanvas(this.W, this.H), sc = sil.getContext('2d');
    sc.drawImage(base, 0, 0); sc.globalCompositeOperation = 'source-in'; sc.fillStyle = '#1e1a1c'; sc.fillRect(0, 0, this.W, this.H);
    const out = makeCanvas(this.W, this.H), oc = out.getContext('2d');
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) oc.drawImage(sil, dx, dy);
    oc.drawImage(base, 0, 0);
    if (this.cache.size > 300) this.cache.clear();
    this.cache.set(k, out);
    return out;
  },
  draw(ctx, x, y, look, s, frame = 0, blink = false) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.sprite(look, frame, blink), Math.round(x - this.FX * s), Math.round(y - this.FY * s), this.W * s, this.H * s);
  },
  // head-only thumbnail: crop the head area of the sprite into a box
  head(ctx, x, y, size, look) {
    ctx.imageSmoothingEnabled = false;
    const spr = this.sprite(look, 0, false);
    ctx.drawImage(spr, 6, 2, 28, 28, x, y, size, size);
  },
  paint(c, x, y, look, frame, blink) {

    const step = [0, 1, 0, -1][frame % 4], bob = frame % 2 ? -1 : 0, hs = look.hairStyle;

    r(1, -6 - rL, 6, 5, '#6b4528'); r(1, -6 - rL, 6, 1, '#8a5e38'); r(1, -2 - rL, 6, 1, '#3e2614');
    r(-6, -14 - lL + bob, 5, 8, pants); r(1, -14 - rL + bob, 5, 8, pants);

    // backpack behind the torso
    r(-10, -30 + bob, 4, 13, pack); r(6, -30 + bob, 4, 13, pack); r(-8, -33 + bob, 16, 4, pack);
    r(-10, -22 + bob, 4, 1, 'rgba(0,0,0,0.25)'); r(6, -22 + bob, 4, 1, 'rgba(0,0,0,0.25)');
    // long hair / ponytail hang behind the body
    if (hs === 'long') r(-9, -42 + bob, 18, 17, hair);
    if (hs === 'ponytail') { r(7, -44 + bob, 4, 4, hair); r(9, -41 + bob, 4, 11, hair); r(8, -45 + bob, 3, 2, '#e85a8a'); }
    // torso: shirt, collar, pocket, straps
    r(-6, -28 + bob, 12, 12, shirt); r(-6, -28 + bob, 2, 12, dark);
    r(-3, -28 + bob, 6, 2, dark); r(-1, -26 + bob, 2, 1, skin);
    r(2, -24 + bob, 3, 3, dark); r(-1, -23 + bob, 1, 1, '#f4ecd8'); r(-1, -20 + bob, 1, 1, '#f4ecd8');

    // arms swing opposite to legs
    r(-9, -27 + bob + step, 3, 7, shirt); r(-9, -27 + bob + step, 1, 7, dark); r(-9, -20 + bob + step, 3, 3, skin);
    r(6, -27 + bob - step, 3, 7, shirt); r(6, -20 + bob - step, 3, 3, skin);
    // head

    r(-7, -45 + bob, 14, 16, skin); r(-8, -43 + bob, 16, 12, skin);
    r(-9, -38 + bob, 1, 4, skin); r(8, -38 + bob, 1, 4, skin); // ears
    // hair top + sides
    r(-8, -47 + bob, 16, 5, hair); r(-9, -44 + bob, 2, 7, hair); r(7, -44 + bob, 2, 7, hair); r(-6, -48 + bob, 12, 1, hair);
    if (hs === 'short') { r(-7, -42 + bob, 14, 2, hair); r(-7, -40 + bob, 3, 1, hair); r(4, -40 + bob, 3, 1, hair); }
    if (hs === 'spiky') {

// PlayerProfile (data-schema.md). Migrates v0.1/v0.2 saves (no schemaVersion) to schemaVersion 1.
function migrateProfile(raw) {
  const pr = raw || {};
  if (!pr.schemaVersion) {
    pr.exp = pr.totalExp || 0;
    pr.stats = { trailsCompleted: pr.completions || 0, totalDistanceKm: 0, litterCollected: 0, photosTaken: 0 };
    pr.album = (pr.album || []).map(a => typeof a === 'string' ? { subjectId: a, trailId: TRAIL.id, date: null } : a);
    delete pr.totalExp; delete pr.completions;
    pr.schemaVersion = 1;
  }
  const defaults = {
    schemaVersion: 1, playerId: 'local', exp: 0, coins: 30, day: 1, lang: 'th',
    body: 'male', name: '',
    looks: { male: { ...BODY_PRESETS.male }, female: { ...BODY_PRESETS.female } },
    pack: Object.fromEntries(PACK_ORDER.map(id => [id, ITEMS[id].packDefault])),
    stats: { trailsCompleted: 0, totalDistanceKm: 0, litterCollected: 0, photosTaken: 0 },
    album: [],
    storage: { seed_kaprao: 4, seed_strawberry: 2, flower_pot: 1 },
    camp: { placed: [], plots: CAMP.plots.map(([x, y]) => ({ x, y, cropId: null, grown: 0, watered: false })) },
    quests: { day: 0, list: [] },
    skills: Object.fromEntries(SKILLS.map(s => [s.id, 0])),
    passport: {},
    achievements: {}, rankIdx: 0, title: 'newbie', titlesSeen: ['newbie'], medals: {},
  };
  if (pr.look && !pr.looks) { // v0.1–v0.8 look → per-body looks
    const o = pr.look, shirtToOutfit = [1, 2, 4, 0, 2], hatToAcc = [0, 2, 1];
    pr.looks = { male: { hairStyle: 0, hair: Math.min(o.hair || 0, 5), skin: o.skin || 0, face: 0, outfit: shirtToOutfit[o.shirt] ?? 0, acc: hatToAcc[o.hat] ?? 0 },
                 female: { ...BODY_PRESETS.female } };
    delete pr.look;
  }
  for (const k in defaults) if (pr[k] === undefined) pr[k] = defaults[k];
  for (const b of ['male', 'female']) for (const k of LOOK_ROWS) if (pr.looks[b][k] === undefined) pr.looks[b][k] = BODY_PRESETS[b][k];
  for (const s of SKILLS) if (pr.skills[s.id] === undefined) pr.skills[s.id] = 0;
  if (pr.stats.trailsCompleted > 0 && !pr.passport[TRAIL.parkId]) // older saves: completed before passport existed
    pr.passport[TRAIL.parkId] = { stamped: true, firstDate: null, trails: { [TRAIL.id]: { completions: pr.stats.trailsCompleted, bestTimeSec: null } } };

}
function achTier(id) { const a = profile.achievements[id]; return a ? a.tier : -1; }
function achPoints() { return ACHIEVEMENTS.reduce((s, a) => { let p = 0; for (let i = 0; i <= achTier(a.id); i++) p += TIERS[i].pts; return s + p; }, 0); }
function rankIndex() { const p = achPoints(); let r = 0; RANKS.forEach(([, need], i) => { if (p >= need) r = i; }); return r; }
function rankName() { return t('rank_' + RANKS[rankIndex()][0]); }
function skillRank(id) { return profile.skills[id] || 0; }
function skillBonus(id) { return skillRank(id) * SKILLS.find(s => s.id === id).per; }
const profile = migrateProfile(Save.load());
function addStore(id, n) { profile.storage[id] = Math.max(0, (profile.storage[id] || 0) + n); if (!profile.storage[id]) delete profile.storage[id]; }

function packIds() { return PACK_ORDER.concat(COOKED.filter(id => storeQty(id) > 0)); }

const W = CONFIG.MAP_W, H = CONFIG.MAP_H, TS = CONFIG.TILE;

const World = {
  tiles: null, treeSolid: null, trees: [], pathTiles: [], ground: null, miniVis: null, revealed: null, pathLenPx: 0,
  get(x, y) { if (x < 0 || y < 0 || x >= W || y >= H) return T.ROCK; return this.tiles[y * W + x]; },
  streamX(y) { return 27 + Math.round(1.6 * Math.sin(y * 0.22)); },
  isSolidTile(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return true;
    return TERRAIN[this.tiles[y * W + x]].solid || this.treeSolid[y * W + x] === 1;
  },
  build() {
    const gen = TRAIL.gen, rng = mulberry32(gen.seed);
    const tiles = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const z = gen.zones[gen.zoneAt(x, y)];
      let v = rng() < z.baseP ? z.base[0] : z.base[1];
      if (gen.rock(x, y)) v = T.ROCK;
      if (gen.water(x, y)) v = T.WATER;
      tiles[y * W + x] = v;
    }
    // Path
    this.pathLenPx = 0;
    // main trail + optional side paths ({ pts, steep })
    const lines = [{ pts: TRAIL.waypoints, main: true }, ...(TRAIL.extraPaths || [])];
    for (const line of lines) for (let i = 0; i < line.pts.length - 1; i++) {
      const wps = line.pts, [ax, ay] = wps[i], [bx, by] = wps[i + 1];
      const steep = line.main ? TRAIL.steepSegments.some(([s, e]) => i >= s && i < e) : !!line.steep;
      const len = Math.hypot(bx - ax, by - ay);
      if (line.main) this.pathLenPx += len * TS;
      const steps = Math.ceil(len * 4);
      for (let s = 0; s <= steps; s++) {
        const cx = Math.round(ax + (bx - ax) * s / steps), cy = Math.round(ay + (by - ay) * s / steps);
        for (let oy = 0; oy < 2; oy++) for (let ox = 0; ox < 2; ox++) {
          const tx = cx + ox, ty = cy + oy;
          if (tx < 0 || ty < 0 || tx >= W || ty >= H) continue;
          const k = ty * W + tx, cur = tiles[k];
          if (cur === T.WATER) tiles[k] = T.BRIDGE;
          else if (cur === T.ROCK || cur === T.BRIDGE) continue;
          else tiles[k] = steep ? T.STEEP : T.PATH;
        }
      }
    }
    this.tiles = tiles;
    this.pathTiles = [];
    const noTree = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = tiles[y * W + x];
      if (v === T.PATH || v === T.STEEP || v === T.BRIDGE) {
        if (v !== T.BRIDGE) this.pathTiles.push([x, y]);
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < W && ny < H) noTree[ny * W + nx] = 1;
        }
      }
    }
    // Trees
    this.treeSolid = new Uint8Array(W * H);
    this.trees = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = tiles[y * W + x];
      if (v !== T.MOSS && v !== T.GRASS && v !== T.TALL) continue;
      const r = rng(), phase = rng() * 6.28, variant = Math.floor(rng() * 3);
      if (noTree[y * W + x]) continue;
      if (TRAIL.pois.some(p => Math.hypot(p.x - x, p.y - y) < 2.5)) continue;
      if (Math.hypot(TRAIL.start[0] - x, TRAIL.start[1] - y) < 3) continue;
      const edge = x < 2 || x > W - 3 || y > H - 3;
      const zone = TRAIL.gen.zones[TRAIL.gen.zoneAt(x, y)];
      const density = edge ? 0.85 : zone.density;
      if (r < density) {
        this.trees.push({ x: x * TS + 8, y: y * TS + 14, type: zone.tree, v: variant, phase });
        this.treeSolid[y * W + x] = 1;
      }
    }
    this.renderGround();
    this.miniVis = makeCanvas(W, H);
    this.revealed = new Uint8Array(W * H);
  },
  renderGround() {
    const rng = mulberry32(TRAIL.gen.seed + 1);
    const g = makeCanvas(W * TS, H * TS), c = g.getContext('2d');
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = this.tiles[y * W + x], def = TERRAIN[v], px = x * TS, py = y * TS;
      if (v === T.BRIDGE) {
        c.fillStyle = TERRAIN[T.WATER].base; c.fillRect(px, py, TS, TS);
        c.fillStyle = def.base; c.fillRect(px, py + 1, TS, TS - 2);
        c.fillStyle = def.speck[0];
        for (let i = 0; i < TS; i += 4) c.fillRect(px + i, py + 1, 1, TS - 2);
        c.fillStyle = '#5a3818'; c.fillRect(px, py + 1, TS, 1); c.fillRect(px, py + TS - 2, TS, 1);
        continue;
      }
      const waterC = v === T.WATER && TRAIL.gen.waterBase;
      c.fillStyle = waterC || def.base; c.fillRect(px, py, TS, TS);
      for (let i = 0; i < 10; i++) {
        c.fillStyle = waterC ? '#5cc8b8' : def.speck[Math.floor(rng() * def.speck.length)];
        c.fillRect(px + Math.floor(rng() * TS), py + Math.floor(rng() * TS), 1, 1);
      }
      if (v === T.TALL) {
        c.fillStyle = '#8c9c48';
        for (let i = 0; i < 4; i++) c.fillRect(px + Math.floor(rng() * 15), py + Math.floor(rng() * 13), 1, 3);
      }
      if (v === T.MOSS && rng() < 0.12) { // small fern
        c.fillStyle = '#6aa64a'; const fx = px + 4 + Math.floor(rng() * 8), fy = py + 6 + Math.floor(rng() * 6);
        c.fillRect(fx, fy, 1, 3); c.fillRect(fx - 2, fy + 1, 2, 1); c.fillRect(fx + 1, fy + 1, 2, 1);
      }
      if (v === T.STEEP) { c.fillStyle = '#9c7c58'; c.fillRect(px, py + 5, TS, 1); c.fillRect(px, py + 11, TS, 1); }
      if (v === T.ROCK && this.get(x, y + 1) !== T.ROCK) { c.fillStyle = '#55575e'; c.fillRect(px, py + 11, TS, 5); }
      if ((v === T.PATH || v === T.STEEP) && rng() < 0.15) { c.fillStyle = '#9a8a78'; c.fillRect(px + Math.floor(rng() * 12), py + Math.floor(rng() * 12), 2, 2); }
    }
    this.ground = g;
  },
  reveal(px, py) {
    const tx = Math.floor(px / TS), ty = Math.floor(py / TS), R = CONFIG.REVEAL_RADIUS + skillRank('exploration');
    const mc = this.miniVis.getContext('2d');
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      if (dx * dx + dy * dy > R * R) continue;
      const x = tx + dx, y = ty + dy;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const k = y * W + x;
      if (this.revealed[k]) continue;
      this.revealed[k] = 1;
      mc.fillStyle = this.treeSolid[k] ? (TRAIL.gen.zones[TRAIL.gen.zoneAt(x, y)].tree === 'broad' ? '#2f6b2f' : '#2d5e3a') : TERRAIN[this.tiles[k]].mini;
      mc.fillRect(x, y, 1, 1);
    }
  },
  resetReveal() {
    this.revealed.fill(0);
    const mc = this.miniVis.getContext('2d');
    mc.clearRect(0, 0, W, H);
  },
};

const Time = {
  minutes() { return TRAIL.startHour * 60 + state.time * (1440 / CONFIG.DAY_LENGTH_SEC); },
  hour() { return (this.minutes() / 60) % 24; },
  label() { const m = Math.floor(this.minutes()) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); },
  darkness() {
    const h = this.hour();
    if (h >= 6.5 && h < 18.5) return 0;
    if (h >= 18.5 && h < 19.5) return (h - 18.5) * 0.62;
    if (h >= 19.5 || h < 4.5) return 0.62;
    if (h >= 4.5 && h < 6.5) return 0.62 * (1 - (h - 4.5) / 2);
    return 0;
  },
  tint() {
    const h = this.hour();
    if (h >= 5 && h < 7) return 'rgba(255,170,150,0.12)';
    if (h >= 17 && h < 18.8) return 'rgba(255,150,60,0.16)';
    return null;
  },
};

function toast(text) { state.toasts.push({ text, t: 3.5 }); if (state.toasts.length > 3) state.toasts.shift(); }

function rollWeather() {
  let r = Math.random(), acc = 0;
  const ch = TRAIL.weatherChances; // some trails are rainier than others
  for (const w of WEATHER) { acc += ch ? ch[w.id] : w.chance; if (r < acc) return w.id; }
  return 'clear';
}

function startGame() {
  state.screen = 'play';
  state.time = 0;
  state.player = {
    x: TRAIL.start[0] * TS + 8, y: TRAIL.start[1] * TS + 10, dir: 'up', frame: 0, animT: 0,
    moving: false, running: false, sitting: false, exhausted: false,
    stamina: 100, hunger: 100, thirst: 100, warmth: CONFIG.WARMTH_START,
    backpack: Backpack.fromPack(profile.pack), wearing: { body: null, rain: null },
    dist: 0, zeroTimer: 0,
  };
  if (Backpack.has(state.player.backpack, 'jacket')) state.player.wearing.body = 'jacket'; // cold morning start
  for (const s of state.player.backpack.slots) if (COOKED.includes(s.itemId)) addStore(s.itemId, -s.qty); // cooked food leaves camp storage
  Save.write(profile);
  state.spawns = []; state.activeEvents = []; state.nextEventIn = 25 + Math.random() * 15;
  state.done = {}; state.photos = []; state.checkpoint = false; state.secretFound = false; state.litterTaken = 0;
  state.zonesSeen = {}; state.warn = {}; state.toasts = []; state.dialog = null; state.flash = 0; state.lastZone = null;
  // Litter on random path tiles, away from the start
  const candidates = World.pathTiles.filter(([x, y]) => Math.hypot(x - TRAIL.start[0], y - TRAIL.start[1]) > 8);
  state.litter = [];
  let guard = 0;
  while (state.litter.length < TRAIL.litterCount && guard++ < 500) {
    const [x, y] = candidates[Math.floor(Math.random() * candidates.length)];
    if (state.litter.some(l => Math.hypot(l.tx - x, l.ty - y) < 6)) continue;
    state.litter.push({ tx: x, ty: y, x: x * TS + 4 + Math.random() * 8, y: y * TS + 6 + Math.random() * 6, kind: Math.random() < 0.5 ? 0 : 1, taken: false });
  }
  state.bird = null;
  if (TRAIL.bird) {
    const [bx, by] = TRAIL.bird.home;
    state.bird = { x: bx * TS + 8, y: by * TS + 8, homeX: bx * TS + 8, homeY: by * TS + 8, tx: bx * TS + 8, ty: by * TS + 8, wait: 1, flying: false };

function hasPhoto(id) { return state.photos.includes(id); }

const Backpack = {
  fromPack(pack) {
    const slots = [];
    for (const id of packIds()) {
      const n = Math.min(pack[id] || 0, packMax(id)), def = ITEMS[id];
      if (!n) continue;
      if (def.stack === 1) for (let i = 0; i < n; i++) slots.push({ itemId: id, qty: 1, full: id === 'water_bottle', charges: def.charges });
      else slots.push({ itemId: id, qty: n });
    }
    return { slots };
  },
  slotWeight(s) { const d = ITEMS[s.itemId]; return (s.itemId === 'water_bottle' && !s.full ? d.emptyKg : d.weightKg) * s.qty; },
  weight(bp) { return bp.slots.reduce((w, s) => w + this.slotWeight(s), 0); },
  packWeight(pack) { return packIds().reduce((w, id) => w + ITEMS[id].weightKg * Math.min(pack[id] || 0, packMax(id)), 0); },
  packSlots(pack) { return packIds().reduce((n, id) => { const q = Math.min(pack[id] || 0, packMax(id)); return n + (!q ? 0 : ITEMS[id].stack === 1 ? q : 1); }, 0); },
  has(bp, id) { return bp.slots.some(s => s.itemId === id); },
  overweight(bp) { return this.weight(bp) > CONFIG.MAX_WEIGHT_KG; },
  add(bp, id, qty = 1) {
    const def = ITEMS[id];
    if (def.stack > 1) {
      const s = bp.slots.find(s => s.itemId === id && s.qty < def.stack);
      if (s) { s.qty = Math.min(def.stack, s.qty + qty); return true; }
    }
    if (bp.slots.length >= CONFIG.MAX_SLOTS) return false;
    bp.slots.push({ itemId: id, qty: def.stack > 1 ? qty : 1, full: id === 'water_bottle' ? true : undefined, charges: def.charges });
    return true;
  },
  hasEmptyBottle(bp) { return bp.slots.some(s => s.itemId === 'water_bottle' && !s.full); },
  refill(bp) { for (const s of bp.slots) if (s.itemId === 'water_bottle') s.full = true; },
  use(i) {
    const p = state.player, bp = p.backpack, s = bp.slots[i];
    if (!s) return;
    const def = ITEMS[s.itemId], name = t('item_' + s.itemId);
    if (def.wearable) {
      const slot = def.wearable.slot;
      if (p.wearing[slot] === s.itemId) { p.wearing[slot] = null; toast(t('msg_unwear', { s: name })); }
      else { p.wearing[slot] = s.itemId; toast(t('msg_wear', { s: name })); }
      return;
    }
    if (def.passive || !def.effects) return;
    if (s.itemId === 'water_bottle') {
      if (!s.full) { toast(t('msg_empty')); return; }
      s.full = false; toast(t('msg_drink')); Sound.sfx('drink');
    } else if (def.needSit) {
      if (!p.sitting) { toast(t('msg_needSit')); Sound.sfx('error'); return; }
      s.charges--; if (s.charges <= 0) bp.slots.splice(i, 1);
      toast(t('msg_coffee')); Sound.sfx('drink');
    } else {
      s.qty--; if (s.qty <= 0) bp.slots.splice(i, 1);
      Sound.sfx(def.effects.thirst && !def.effects.hunger ? 'drink' : 'eat');
      toast(s.itemId === 'sticky_rice' ? t('msg_eat') : t('msg_used', { s: name }));
    }
    const e = def.effects, k = COOKED.includes(s.itemId) ? 1 + skillBonus('cooking') : 1;
    if (e.thirst) p.thirst = clamp(p.thirst + e.thirst * k, 0, 100);
    if (e.hunger) p.hunger = clamp(p.hunger + e.hunger * k, 0, 100);
    if (e.stamina) p.stamina = clamp(p.stamina + e.stamina * k, 0, p.thirst <= 0 ? 50 : 100);
    if (e.warmth) p.warmth = clamp(p.warmth + e.warmth * k, 0, 100);
  },
};

const Climate = {
  ambientC() {
    const h = Time.hour(), pts = CLIMATE.hourly;
    let c = pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const [h0, c0] = pts[i], [h1, c1] = pts[i + 1];
      if (h >= h0 && h <= h1) { c = c0 + (c1 - c0) * (h - h0) / (h1 - h0); break; }
    }
    c += (CLIMATE.zoneC[state.lastZone] || 0) + TRAIL.climateC;
    if (state.weather === 'fog') c += CLIMATE.fogC;
    if (state.weather === 'drizzle') c += CLIMATE.drizzleC;
    return c + Events.sum('tempC');
  },
  wet() {
    const p = state.player;
    return (state.weather === 'drizzle' && p.wearing.rain !== 'raincoat') || (p.wetUntil || 0) > state.time;
  },
  feelsC() {
    const p = state.player;
    let c = this.ambientC();
    if (p.wearing.body) c += ITEMS[p.wearing.body].wearable.warmthC;
    if (p.moving) c += p.running ? CONFIG.RUN_C : CONFIG.MOVE_C;
    if (this.wet()) c += CONFIG.WET_C;
    return c;
  },
};

const Events = {
  def(id) { return EVENTS.find(e => e.id === id); },
  sum(key) { return state.activeEvents.reduce((v, a) => v + (this.def(a.id)[key] || 0), 0); },
  speedMult() { return state.activeEvents.reduce((v, a) => v * (this.def(a.id).speedMult || 1), 1); },
  isActive(id) { return state.activeEvents.some(a => a.id === id); },
  update(dt) {
    state.activeEvents = state.activeEvents.filter(a => a.until > state.time);
    state.spawns = state.spawns.filter(s => !s.gone && (s.until === undefined || s.until > state.time));
    const p = state.player;
    for (const s of state.spawns) {
      if (s.kind !== 'animal') continue;
      s.bob = (s.bob || 0) + dt;
      if (p.running && Math.hypot(p.x - s.x, p.y - s.y) < 70) { s.gone = true; toast(t('msg_deerFled')); }
    }
    state.nextEventIn -= dt;
    if (state.nextEventIn > 0) return;
    state.nextEventIn = CONFIG.EVENT_GAP_MIN + Math.random() * (CONFIG.EVENT_GAP_MAX - CONFIG.EVENT_GAP_MIN);
    this.trigger();
  },
  trigger(forceId) {
    const pool = EVENTS.filter(e => !this.isActive(e.id))
      .map(e => ({ e, w: forceId ? (e.id === forceId ? 1 : 0) : e.weight() })).filter(o => o.w > 0);
    if (!pool.length) return;
    let r = Math.random() * pool.reduce((s, o) => s + o.w, 0), e = pool[0].e;
    for (const o of pool) { r -= o.w; if (r <= 0) { e = o.e; break; } }
    if (e.spawn) {
      const spot = this.spotAhead();
      if (!spot) return;
      state.spawns.push({ ...e.spawn, x: spot[0], y: spot[1], until: e.duration ? state.time + e.duration : undefined });
    }
    if (e.duration) state.activeEvents.push({ id: e.id, until: state.time + e.duration });
    toast(t('ev_' + e.id));
  },
  spotAhead() {
    const p = state.player;
    const c = World.pathTiles.filter(([x, y]) => { const d = Math.hypot(x * TS + 8 - p.x, y * TS + 8 - p.y); return d > 64 && d < 130; });
    if (!c.length) return null;
    const [x, y] = c[Math.floor(Math.random() * c.length)];
    return [x * TS + 8, y * TS + 10];
  },
};

const Player = {
  canStand(px, py) {
    const pts = [[px - 4, py - 3], [px + 4, py - 3], [px - 4, py + 1], [px + 4, py + 1]];
    return pts.every(([x, y]) => !World.isSolidTile(Math.floor(x / TS), Math.floor(y / TS)));
  },
  update(dt, input) {
    const p = state.player;
    let dx = 0, dy = 0;
    if (input.left) dx -= 1; if (input.right) dx += 1;
    if (input.up) dy -= 1; if (input.down) dy += 1;
    p.moving = dx !== 0 || dy !== 0;
    if (p.moving) {
      p.sitting = false;
      if (state.dialog) state.dialog = null;
      const len = Math.hypot(dx, dy); dx /= len; dy /= len;
      if (Math.abs(dx) > Math.abs(dy)) p.dir = dx < 0 ? 'left' : 'right'; else p.dir = dy < 0 ? 'up' : 'down';
      p.running = input.run && !p.exhausted && p.stamina > 0;
      const tile = World.get(Math.floor(p.x / TS), Math.floor(p.y / TS));
      let speed = (p.running ? CONFIG.RUN_SPEED : CONFIG.WALK_SPEED) * (TERRAIN[tile].speed || 1);
      if (state.weather === 'drizzle') speed *= TERRAIN[tile].steep ? 0.75 : 0.88;
      if (p.exhausted) speed *= CONFIG.EXHAUSTED_SPEED;
      speed *= Events.speedMult();
      if (Backpack.overweight(p.backpack)) speed *= CONFIG.OVERWEIGHT_SPEED;
      const nx = p.x + dx * speed * dt, ny = p.y + dy * speed * dt;
      const ox = p.x, oy = p.y;
      if (this.canStand(nx, p.y)) p.x = nx;
      if (this.canStand(p.x, ny)) p.y = ny;
      p.dist += Math.hypot(p.x - ox, p.y - oy);
      p.animT += dt * (p.running ? 12 : 8);
      const nf = Math.floor(p.animT) % 4;
      if (nf !== p.frame && nf % 2 === 1) Sound.step(tile);
      p.frame = nf;
    } else { p.running = false; p.frame = 0; }
    p.x = clamp(p.x, 6, W * TS - 6); p.y = clamp(p.y, 6, H * TS - 2);
    this.updateStats(dt);
    World.reveal(p.x, p.y);
    this.updateZone();
  },
  updateStats(dt) {
    const p = state.player;
    const tile = World.get(Math.floor(p.x / TS), Math.floor(p.y / TS));
    if (p.moving) {
      let drain = p.running ? CONFIG.STAMINA_RUN : CONFIG.STAMINA_WALK;
      if (TERRAIN[tile].steep) drain *= CONFIG.STEEP_STAMINA_MULT;
      if (Backpack.overweight(p.backpack)) drain *= CONFIG.OVERWEIGHT_STAMINA;
      if (p.warmth < 30) drain *= CONFIG.COLD_STAMINA_MULT;
      drain *= 1 - skillBonus('hiking');
      p.stamina -= drain * dt;
    } else {
      let regen = (p.sitting ? CONFIG.STAMINA_REGEN_REST : CONFIG.STAMINA_REGEN_IDLE) * (1 + skillBonus('camping'));
      if (p.hunger <= 0) regen *= 0.5;
      p.stamina += regen * dt;
    }
    const maxSt = p.thirst <= 0 ? 50 : 100;
    p.stamina = clamp(p.stamina, 0, maxSt);
    if (p.stamina <= 0 && !p.exhausted) { p.exhausted = true; toast(t('msg_exhausted')); }
    if (p.exhausted && p.stamina >= CONFIG.EXHAUSTED_RECOVER) p.exhausted = false;

    const h = Time.hour();
    const surv = 1 - skillBonus('survival');
    p.hunger -= CONFIG.HUNGER_RATE * dt * (p.sitting ? 0.5 : 1) * surv;
    let thirstMult = state.weather === 'drizzle' ? 0.6 : (state.weather === 'clear' && h >= 11 && h < 15 ? 1.3 : 1);
    p.thirst -= CONFIG.THIRST_RATE * dt * thirstMult * surv;
    p.hunger = clamp(p.hunger, 0, 100); p.thirst = clamp(p.thirst, 0, 100);

    if (p.hunger < 25 && !state.warn.hunger) { state.warn.hunger = true; toast(t('msg_hungry')); }
    if (p.hunger > 40) state.warn.hunger = false;
    if (p.thirst < 25 && !state.warn.thirst) { state.warn.thirst = true; toast(t('msg_thirsty')); }
    if (p.thirst > 40) state.warn.thirst = false;

    // Temperature
    if (state.weather === 'drizzle' && !p.wearing.rain && Backpack.has(p.backpack, 'raincoat')) { p.wearing.rain = 'raincoat'; toast(t('msg_rain')); }
    const feels = Climate.feelsC();
    if (feels < CONFIG.COMFORT_MIN_C) p.warmth -= (CONFIG.COMFORT_MIN_C - feels) * CONFIG.COLD_LOSS * dt;
    else {
      p.warmth += CONFIG.WARM_GAIN * dt;
      if (feels > CONFIG.COMFORT_MAX_C) p.thirst = clamp(p.thirst - (feels - CONFIG.COMFORT_MAX_C) * CONFIG.HOT_THIRST * dt, 0, 100);
    }
    p.warmth = clamp(p.warmth, 0, 100);
    if (p.warmth < 30 && !state.warn.cold) { state.warn.cold = true; toast(t('msg_cold')); }
    if (p.warmth > 50) state.warn.cold = false;
    if (feels > CONFIG.COMFORT_MAX_C + 2 && p.wearing.body && !state.warn.hot) { state.warn.hot = true; toast(t('msg_hot')); }
    if (feels < CONFIG.COMFORT_MAX_C) state.warn.hot = false;
    if (p.moving && Backpack.overweight(p.backpack) && !state.warn.weight) { state.warn.weight = true; toast(t('msg_overweight')); }

    const starving = p.hunger <= 0 && p.thirst <= 0, frozen = p.warmth <= 0;
    if (starving || frozen) {
      if (p.zeroTimer === 0) toast(starving ? t('msg_rescueWarn') : t('msg_cold'));
      p.zeroTimer += dt;
      if (p.zeroTimer > CONFIG.RESCUE_SECONDS) { state.rescueReason = frozen ? 'cold' : 'starve'; state.screen = 'rescue'; Sound.sfx('sad'); }
    } else p.zeroTimer = 0;
  },
  updateZone() {
    const p = state.player, tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
    let zone = TRAIL.gen.zoneAt(tx, ty);
    let nearWater = false;
    for (let dy = -2; dy <= 2 && !nearWater; dy++) for (let dx = -2; dx <= 2; dx++) if (World.get(tx + dx, ty + dy) === T.WATER) { nearWater = true; break; }
    if (nearWater) zone = TRAIL.bird ? 'stream' : 'water';
    if (zone !== state.lastZone) {
      state.lastZone = zone;
      if (!state.zonesSeen[zone]) { state.zonesSeen[zone] = true; toast('📍 ' + t('zone_' + zone)); }
    }
  },
};

const Bird = {
  update(dt) {
    const b = state.bird, p = state.player;
    if (!b) return;
    const d = Math.hypot(p.x - b.x, p.y - b.y);
    if (!b.flying && p.running && d < 60) {
      const spots = TRAIL.bird.fleeSpots.filter(([x, y]) => Math.hypot(x * TS - b.homeX, y * TS - b.homeY) > 40);
      const [sx, sy] = spots[Math.floor(Math.random() * spots.length)];
      b.homeX = sx * TS + 8; b.homeY = sy * TS + 8; b.tx = b.homeX; b.ty = b.homeY; b.flying = true;
      toast(t('msg_birdFled'));
    }
    const speed = b.flying ? 130 : 22;
    const ddx = b.tx - b.x, ddy = b.ty - b.y, dist = Math.hypot(ddx, ddy);
    if (dist > 1) { const m = Math.min(dist, speed * dt); b.x += ddx / dist * m; b.y += ddy / dist * m; }
    else {
      b.flying = false;
      b.wait -= dt;
      if (b.wait <= 0) { b.wait = 1.5 + Math.random() * 2; b.tx = b.homeX + (Math.random() - 0.5) * 50; b.ty = b.homeY + (Math.random() - 0.5) * 40; }
    }
  },
};

// Interaction: find the nearest thing the player can act on.
const Interact = {
  find() {
    const p = state.player;
    let best = null, bd = Infinity;
    const consider = (d, range, obj) => { if (d <= range && d < bd) { bd = d; best = obj; } };
    for (const poi of TRAIL.pois) {
      if ((poi.type === 'item' || poi.type === 'secret' || poi.type === 'photo') && state.done[poi.id]) continue;
      const cx = poi.x * TS + 8, cy = poi.y * TS + 10;
      const d = Math.hypot(p.x - cx, p.y - cy);
      const range = poi.type === 'secret' ? 20 : poi.type === 'viewpoint' ? 30 : CONFIG.INTERACT_RANGE;
      const act = { sign: 'act_read', npc: 'act_talk', bench: 'act_rest', viewpoint: 'act_photo', photo: 'act_photo',
                    secret: 'act_explore', item: 'act_pick', goal: 'act_finish', waterfall: 'act_photo' }[poi.type];
      if (poi.type === 'bench' && p.sitting) continue;
      const label = poi.type === 'stall' ? t('act_stall', { s: t(poi.nameKey), p: STALL_PRICE }) : t(act);
      consider(d, range, { kind: 'poi', poi, label });
    }
    for (const l of state.litter) if (!l.taken) consider(Math.hypot(p.x - l.x, p.y - l.y), 18, { kind: 'litter', l, label: t('act_litter') });
    for (const s of state.spawns) {
      const d = Math.hypot(p.x - s.x, p.y - s.y);
      if (s.kind === 'animal' && !hasPhoto(s.subject)) consider(d, 44, { kind: 'spawn', s, label: t('act_photo') });
      if (s.kind === 'item') consider(d, 18, { kind: 'spawn', s, label: t('act_pick') });
    }
    {
      const tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
      let wet = false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (World.get(tx + dx, ty + dy) === T.WATER) wet = true;
      if (wet && Backpack.hasEmptyBottle(p.backpack)) consider(14, 20, { kind: 'water', label: t('act_refill') });
      else if (wet && TRAIL.swim) consider(15, 20, { kind: 'swim', label: t('act_swim') });
    }
    const b = state.bird;
    if (b && !b.flying && !hasPhoto(TRAIL.bird.subject || 'sunbird')) consider(Math.hypot(p.x - b.x, p.y - b.y), 44, { kind: 'bird', label: t('act_photo') });
    return best;
  },
  run(target) {
    const p = state.player;
    if (!target) return;
    if (target.kind === 'litter') {
      if (!Backpack.add(p.backpack, 'litter')) { toast(t('msg_full')); return; }
      target.l.taken = true; state.litterTaken++; toast(t('msg_litter')); Sound.sfx('pickup'); Quests.notify('collectLitter'); return;
    }
    if (target.kind === 'water') { Backpack.refill(p.backpack); toast(t('msg_refill')); Sound.sfx('water'); return; }
    if (target.kind === 'swim') {
      p.wetUntil = state.time + 45; p.stamina = clamp(p.stamina + 25, 0, p.thirst <= 0 ? 50 : 100);
      state.flash = 0.4; toast(t('msg_swim')); Sound.sfx('splash'); return;
    }
    if (target.kind === 'spawn') {
      const s = target.s;
      if (s.kind === 'animal') { if (p.running) { toast(t('msg_birdRun')); return; } takePhoto(s.subject); return; }
      if (!Backpack.add(p.backpack, s.itemId)) { toast(t('msg_full')); return; }
      s.gone = true; toast(t('msg_pickedUp', { s: t('item_' + s.itemId) })); Sound.sfx('pickup'); return;
    }
    if (target.kind === 'bird') { if (p.running) { toast(t('msg_birdRun')); return; } takePhoto(TRAIL.bird.subject || 'sunbird'); return; }
    const poi = target.poi;
    switch (poi.type) {
      case 'sign': toast(t(TRAIL.signKey)); break;
      case 'npc': state.dialog = { lines: t(poi.linesKey || 'guide'), i: 0 }; break;
      case 'bench': p.sitting = true; p.x = poi.x * TS + 8; p.y = poi.y * TS + 12; p.dir = 'down'; break;
      case 'stall':
        if (profile.coins < STALL_PRICE) { toast(t('msg_noCoins')); Sound.sfx('error'); break; }
        profile.coins -= STALL_PRICE; Backpack.refill(p.backpack); Sound.sfx('select');
        toast(Backpack.add(p.backpack, 'sticky_rice') ? t('msg_stall') : t('msg_refill'));
        Save.write(profile);
        break;
      case 'viewpoint': {
        if (poi.id === TRAIL.checkpointId && !state.checkpoint) { state.checkpoint = true; toast(t('msg_checkpoint')); }
        if (rareOk(poi.rare) && !hasPhoto(poi.rare.subject)) takePhoto(poi.rare.subject);
        else takePhoto(poi.subject);
        break;
      }
      case 'photo':
        if (poi.seasons && !poi.seasons.includes(season())) { toast(t(poi.seasonMsg || 'msg_notSeason')); break; }
        state.done[poi.id] = true; takePhoto(poi.subject); break;
      case 'secret': state.done[poi.id] = true; state.secretFound = true; takePhoto(poi.subject); break;
      case 'waterfall': takePhoto(poi.subject); break;
      case 'item':
        if (!Backpack.add(p.backpack, poi.item)) { toast(t('msg_full')); break; }
        state.done[poi.id] = true; Sound.sfx('pickup');
        toast(poi.item === 'flashlight' ? t('msg_flashlight') : t('msg_pickedUp', { s: t('item_' + poi.item) }));
        break;
      case 'goal':
        if (TRAIL.checkpointId && !state.checkpoint) { toast(t('msg_needView')); break; }
        if (rareOk(poi.rare) && !hasPhoto(poi.rare.subject)) takePhoto(poi.rare.subject);
        if (poi.photo && !hasPhoto(poi.photo)) takePhoto(poi.photo);
        finishTrail(); break;
    }
  },
};
function rareOk(r) {
  if (!r) return false;
  const h = Time.hour();
  if (r.weather && state.weather !== r.weather) return false;
  if (r.hourFrom !== undefined && h < r.hourFrom) return false;
  if (r.hourTo !== undefined && h >= r.hourTo) return false;
  return true;
}

function finishTrail() {
  const p = state.player;
  const lockedBefore = TRAILS.filter(x => !trailUnlocked(x));
  let exp = 50 + state.litterTaken * 10;
  for (const ph of state.photos) exp += Math.round(PHOTO_SUBJECTS[ph].exp * (1 + skillBonus('photography')));
  const coins = 20 + state.litterTaken * 3 + state.photos.length * 2;
  const km = p.dist * TRAIL.realData.distanceKm / World.pathLenPx;
  profile.coins += coins;
  const st = profile.stats;
  st.trailsCompleted += 1; st.totalDistanceKm += km; st.litterCollected += state.litterTaken; st.photosTaken += state.photos.length;
  const today = new Date().toISOString().slice(0, 10);
  for (const ph of state.photos) if (!profile.album.some(a => a.subjectId === ph)) profile.album.push({ subjectId: ph, trailId: TRAIL.id, date: today });
  const pp = profile.passport[TRAIL.parkId] || (profile.passport[TRAIL.parkId] = { stamped: true, firstDate: today, trails: {} });
  if (!pp.firstDate) pp.firstDate = today;
  const tr = pp.trails[TRAIL.id] || (pp.trails[TRAIL.id] = { completions: 0, bestTimeSec: null });
  tr.completions++;
  const timeSec = Math.floor(state.time);
  if (tr.bestTimeSec === null || timeSec < tr.bestTimeSec) tr.bestTimeSec = timeSec;
  Level.gain(exp);
  Quests.notify('completeTrail');
  for (const x of lockedBefore) if (trailUnlocked(x)) toast(t('msg_unlockTrail', { t: t(x.trailKey) }));
  Save.write(profile);
  const secs = Math.floor(state.time);
  state.summary = {
    time: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'),
    clock: Time.label(),
    dist: km.toFixed(1), coins,
    photos: state.photos.length, litter: state.litterTaken, secret: state.secretFound, exp,
    date: new Date().toLocaleDateString(profile.lang === 'th' ? 'th-TH' : 'en-GB'),
  };
  state.screen = 'summary'; Sound.sfx('stamp');
}

// ---------- Phase 2: Level, Quests, Camp ----------
const Level = {
  need(l) { return Math.round(100 * Math.pow(l, 1.5)); },
  info(exp = profile.exp) {
    let l = 1, rest = exp;
    while (rest >= this.need(l)) { rest -= this.need(l); l++; }
    return { level: l, into: rest, need: this.need(l) };
  },
  gain(n) {
    const before = this.info().level;
    profile.exp += n;
    const after = this.info().level;
    if (after > before) { toast(t('msg_levelUp', { n: after })); Sound.sfx('fanfare'); }
  },
};

function season(day = profile.day) { return SEASONS[Math.floor((day - 1) / SEASON_DAYS) % SEASONS.length]; }

const Quests = {
  def(id) { return QUEST_POOL.find(q => q.id === id); },
  ensure() {
    if (profile.quests.day === profile.day && profile.quests.list.length) return;
    const pool = QUEST_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);
    profile.quests = { day: profile.day, list: pool.map(q => ({ id: q.id, progress: 0, done: false })) };
    Save.write(profile);
  },
  notify(kind, n = 1) {
    let changed = false;
    for (const q of profile.quests.list) {
      const d = this.def(q.id);
      if (!d || q.done || d.kind !== kind) continue;
      q.progress = Math.min(d.count, q.progress + n); changed = true;
      if (q.progress >= d.count) {
        q.done = true; profile.coins += d.coins; Level.gain(d.exp);
        toast(t('msg_questDone', { q: t('q_' + d.id) }) + ` +${d.exp} EXP +${d.coins}🪙`); Sound.sfx('chime');
      }
    }
    if (changed) Save.write(profile);
  },
};

const Camp = {
  ground: null, trees: [], solid: null, pathMask: null,
  inside(x, y) { return x >= 0 && y >= 0 && x < CAMP.W && y < CAMP.H; },
  build() {
    const CW = CAMP.W, CH = CAMP.H, rng = mulberry32(99);
    this.pathMask = new Uint8Array(CW * CH);
    for (const [x0, y0, x1, y1] of CAMP.paths) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.pathMask[y * CW + x] = 1;
    this.solid = new Uint8Array(CW * CH);
    this.trees = [];
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
      const border = x === 0 || x === CW - 1 || y === 0 || (y === CH - 1 && !(x >= 2 && x <= 3));
      const r = rng(), v = Math.floor(rng() * 3), phase = rng() * 6.28;
      if (border) { this.trees.push({ x: x * TS + 8, y: y * TS + 14, type: r < 0.5 ? 'broad' : 'pine', v, phase }); this.solid[y * CW + x] = 1; }
    }
    for (const f of CAMP.fixed) if (f.type !== 'trailSign') {
      this.solid[f.y * CW + f.x] = 1;
      if (f.type === 'tent') this.solid[f.y * CW + f.x + 1] = 1;
    }
    const g = makeCanvas(CW * TS, CH * TS), c = g.getContext('2d');
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
      const def = TERRAIN[this.pathMask[y * CW + x] ? T.PATH : T.GRASS], px = x * TS, py = y * TS;
      c.fillStyle = def.base; c.fillRect(px, py, TS, TS);
      for (let i = 0; i < 10; i++) { c.fillStyle = def.speck[Math.floor(rng() * def.speck.length)]; c.fillRect(px + Math.floor(rng() * TS), py + Math.floor(rng() * TS), 1, 1); }
      if (!this.pathMask[y * CW + x] && rng() < 0.08) { c.fillStyle = ['#f4ecd8', '#f2c94c', '#e88aa8'][Math.floor(rng() * 3)]; c.fillRect(px + 4 + Math.floor(rng() * 8), py + 4 + Math.floor(rng() * 8), 1, 1); }
    }
    this.ground = g;
  },
  placedAt(x, y) { return profile.camp.placed.find(o => o.x === x && o.y === y); },
  plotAt(x, y) { return profile.camp.plots.find(o => o.x === x && o.y === y); },
  isSolid(x, y) { return !this.inside(x, y) || this.solid[y * CAMP.W + x] === 1 || !!this.placedAt(x, y); },
  canStand(px, py) {
    const pts = [[px - 4, py - 3], [px + 4, py - 3], [px - 4, py + 1], [px + 4, py + 1]];
    return pts.every(([x, y]) => !this.isSolid(Math.floor(x / TS), Math.floor(y / TS)));
  },
  enter() {
    const p = state.player;
    if (p && !p.returned) { // bring leftover cooked food home
      for (const s of p.backpack.slots) if (COOKED.includes(s.itemId)) addStore(s.itemId, s.qty);
      p.returned = true;
    }
    state.screen = 'camp'; state.menu = null; state.build = null; state.toasts = [];
    state.cp = { x: CAMP.start[0] * TS + 8, y: CAMP.start[1] * TS + 10, dir: 'up', frame: 0, animT: 0, moving: false };
    Quests.ensure();
    Save.write(profile);
  },
  update(dt, inp) {
    const p = state.cp;
    if (state.menu) { p.moving = false; p.frame = 0; return; }
    let dx = 0, dy = 0;
    if (inp.left) dx -= 1; if (inp.right) dx += 1; if (inp.up) dy -= 1; if (inp.down) dy += 1;
    p.moving = dx !== 0 || dy !== 0;
    if (!p.moving) { p.frame = 0; return; }
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx < 0 ? 'left' : 'right'; else p.dir = dy < 0 ? 'up' : 'down';
    const speed = inp.run ? CONFIG.RUN_SPEED : CONFIG.WALK_SPEED;
    const nx = p.x + dx * speed * dt, ny = p.y + dy * speed * dt;
    if (this.canStand(nx, p.y)) p.x = nx;
    if (this.canStand(p.x, ny)) p.y = ny;
    p.x = clamp(p.x, 6, CAMP.W * TS - 6); p.y = clamp(p.y, 6, CAMP.H * TS - 2);
    p.animT += dt * (inp.run ? 12 : 8);
    const nf = Math.floor(p.animT) % 4;
    if (nf !== p.frame && nf % 2 === 1) Sound.step(this.pathMask[Math.floor(p.y / TS) * CAMP.W + Math.floor(p.x / TS)] ? T.PATH : T.GRASS);
    p.frame = nf;
  },
  cursor() {
    const p = state.cp, tx = Math.floor(p.x / TS), ty = Math.floor((p.y - 4) / TS);
    const [ox, oy] = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[p.dir];
    return [tx + ox, ty + oy];
  },
  seeds() { return Object.keys(CROPS).filter(k => storeQty(CROPS[k].seed) > 0); },
  selectedCrop() {
    const s = this.seeds();
    if (!s.length) return null;
    state.seedSel = (state.seedSel || 0) % s.length;
    return s[state.seedSel];
  },
  find() {
    const p = state.cp;
    const [cx, cy] = this.cursor();
    const ftx = Math.floor(p.x / TS), fty = Math.floor((p.y - 4) / TS);
    const plot = this.plotAt(cx, cy) || this.plotAt(ftx, fty);
    if (plot) {
      if (!plot.cropId) { const c = this.selectedCrop(); return { kind: 'plot', plot, label: c ? t('act_plant', { s: t('item_' + CROPS[c].produce) }) : t('act_noSeed') }; }
      const crop = CROPS[plot.cropId];
      if (plot.grown >= crop.days) return { kind: 'plot', plot, label: t('act_harvest') };
      return { kind: 'plot', plot, label: plot.watered ? t('act_growing') : t('act_water') };
    }
    let best = null, bd = Infinity;
    for (const f of CAMP.fixed) {
      const fx = f.x * TS + (f.type === 'tent' ? 16 : 8), fy = f.y * TS + 12;
      const d = Math.hypot(p.x - fx, p.y - fy);
      if (d < 30 && d < bd) { bd = d; best = f; }
    }
    if (!best) return null;
    const label = { tent: 'act_sleep', campfire: 'act_cook', board: 'act_quests', mailbox: 'act_shop', trailSign: 'act_hike' }[best.type];
    return { kind: 'fixed', f: best, label: t(label) };
  },
  run(target) {
    if (!target) return;
    if (target.kind === 'plot') return this.plotAction(target.plot);
    switch (target.f.type) {
      case 'tent': this.sleep(); break;
      case 'campfire': state.menu = { type: 'cook', sel: 0 }; break;
      case 'board': state.menu = { type: 'quests', sel: 0 }; break;
      case 'mailbox': state.menu = { type: 'shop', sel: 0 }; break;
      case 'trailSign': state.menu = { type: 'trails', sel: Math.max(0, TRAILS.indexOf(TRAIL)) }; break;
    }
  },
  plotAction(plot) {
    Sound.sfx(plot.cropId && plot.grown < CROPS[plot.cropId].days && !plot.watered ? 'water' : 'pickup');
    if (!plot.cropId) {
      const c = this.selectedCrop();
      if (!c) { toast(t('msg_noSeed')); return; }
      const crop = CROPS[c], name = t('item_' + crop.produce);
      if (!crop.seasons.includes(season())) { toast(t('msg_season', { s: name })); return; }
      addStore(crop.seed, -1);
      Object.assign(plot, { cropId: c, grown: 0, watered: false });
      toast(t('msg_planted', { s: name })); Quests.notify('plant');
    } else {
      const crop = CROPS[plot.cropId];
      if (plot.grown >= crop.days) {
        const amount = crop.yield + skillRank('gardening');
        addStore(crop.produce, amount);
        toast(t('msg_harvest', { s: t('item_' + crop.produce), n: amount }));
        Object.assign(plot, { cropId: null, grown: 0, watered: false });
        profile.stats.harvests = (profile.stats.harvests || 0) + 1;
        Quests.notify('harvest');
      } else if (!plot.watered) { plot.watered = true; toast(t('msg_watered')); }
      else toast(t('msg_growing', { n: crop.days - plot.grown }));
    }
    Save.write(profile);
  },
  sleep() {
    const before = season();
    for (const pl of profile.camp.plots) if (pl.cropId && pl.watered) pl.grown++;
    for (const pl of profile.camp.plots) pl.watered = false;
    profile.day++;
    state.flash = 1; Sound.sfx('sleep');
    toast(t('msg_sleep', { n: profile.day, s: t('season_' + season()) }));
    if (season() !== before) toast(t('msg_newSeason', { s: t('season_' + season()) }));
    Quests.ensure();
    Save.write(profile);
  },
  ownedFurniture() { return FURNITURE.filter(id => storeQty(id) > 0); },
  toggleBuild() {
    if (state.build) { state.build = null; return; }
    state.build = { sel: 0 };
    if (!this.ownedFurniture().length && !profile.camp.placed.length) toast(t('build_none'));
  },
  buildItem() { const o = this.ownedFurniture(); if (!o.length) return null; state.build.sel = (state.build.sel + o.length) % o.length; return o[state.build.sel]; },
  canPlace(x, y) {
    if (!this.inside(x, y) || this.isSolid(x, y) || this.plotAt(x, y)) return false;
    if (CAMP.fixed.some(f => f.x === x && f.y === y)) return false;
    const p = state.cp, ptx = Math.floor(p.x / TS), pty = Math.floor(p.y / TS);
    return !(ptx === x && pty === y);
  },
  place() {
    const id = this.buildItem();
    if (!id) { toast(t('build_none')); return; }
    const [x, y] = this.cursor();
    if (!this.canPlace(x, y)) { toast(t('msg_cantPlace')); return; }
    profile.camp.placed.push({ itemId: id, x, y });
    addStore(id, -1);
    toast(t('msg_placed', { s: t('item_' + id) })); Quests.notify('placeFurniture');
    Save.write(profile);
  },
  pickUp() {
    const [x, y] = this.cursor(), o = this.placedAt(x, y);
    if (!o) return;
    profile.camp.placed = profile.camp.placed.filter(q => q !== o);
    addStore(o.itemId, 1);
    toast(t('msg_pickedFurn', { s: t('item_' + o.itemId) }));
    Save.write(profile);
  },
};

const Skills = {
  spent() { return Object.values(profile.skills).reduce((a, b) => a + b, 0); },
  points() { return Math.max(0, Level.info().level - 1 - this.spent()); },
  value(s, rank) { return s.per < 1 ? Math.round(s.per * rank * 100) : s.per * rank; },
  upgrade(i) {
    const s = SKILLS[i];
    if (s.locked) { toast(t('msg_skillLocked')); return; }
    if (skillRank(s.id) >= s.max) { toast(t('msg_skillMax')); return; }
    if (this.points() <= 0) { toast(t('msg_noPoints')); return; }
    profile.skills[s.id]++;
    toast(t('msg_skillUp', { s: t('skill_' + s.id), n: profile.skills[s.id] }));
    Save.write(profile);
  },
};
const JOURNAL_TABS = ['album', 'passport', 'achievements', 'medals', 'titles', 'stats'];

const Achievements = {
  timer: 0,
  check() {
    let changed = false;
    const today = new Date().toISOString().slice(0, 10);
    for (const a of ACHIEVEMENTS) {
      const v = a.value();
      let cur = achTier(a.id);
      while (cur + 1 < a.tiers.length && v >= a.tiers[cur + 1]) {
        cur++;
        const tr = TIERS[cur];
        profile.achievements[a.id] = { tier: cur, date: today };
        profile.coins += tr.coins;
        toast(`${tr.icon} ${t('msg_ach', { t: t('tier_' + tr.id), a: t('ach_' + a.id) })} +${tr.coins}🪙`); Sound.sfx('chime');
        changed = true;
      }
    }
    const r = rankIndex();
    if (r > profile.rankIdx) { profile.rankIdx = r; toast(t('msg_rankUp', { r: rankName() })); changed = true; }
    for (const md of MEDALS) if (!profile.medals[md.id] && md.cond()) {
      profile.medals[md.id] = today; profile.coins += MEDAL_COINS;
      toast(`${md.icon} ${t('msg_medal', { m: t('medal_' + md.id) })} +${MEDAL_COINS}🪙`); Sound.sfx('fanfare'); changed = true;
    }
    for (const ti of TITLES) if (ti.cond() && !profile.titlesSeen.includes(ti.id)) {
      profile.titlesSeen.push(ti.id); toast(t('msg_newTitle', { t: t('title_' + ti.id) })); changed = true;
    }
    if (changed) Save.write(profile);
  },
  update(dt) { this.timer -= dt; if (this.timer <= 0) { this.timer = 0.5; this.check(); } },
};
function trailDone(id) { return Object.values(profile.passport).some(pp => pp.trails && pp.trails[id]); }
function trailUnlocked(tr) { return !tr.unlock || (Level.info().level >= tr.unlock.level && trailDone(tr.unlock.trail)); }
function selectTrail(tr) {
  if (TRAIL !== tr) { TRAIL = tr; World.build(); }
  profile.lastTrail = tr.id;
}
function fmtTime(sec) { return sec === null || sec === undefined ? '—' : Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

const Menus = {
  rows() {
    const m = state.menu, lvl = Level.info().level;
    if (m.type === 'trails') return TRAILS.map(tr => {
      const ok = trailUnlocked(tr), req = tr.unlock && TRAILS.find(x => x.id === tr.unlock.trail);
      const pp = profile.passport[tr.parkId], n = pp && pp.trails[tr.id] ? pp.trails[tr.id].completions : 0;
      return { icon: ok ? (n ? '🏅' : '⛰️') : '🔒', label: t(tr.trailKey),
               sub: ok ? `${t(tr.parkKey)} · ${t(tr.diffKey)}` : t('locked_req', { lv: tr.unlock.level, t: t(req.trailKey) }),
               right: ok ? `${t('region_' + tr.region)}${n ? ' · ×' + n : ''}` : '', enabled: ok };
    });
    if (m.type === 'skills') return SKILLS.map(s => {
      const r = skillRank(s.id);
      return {
        icon: s.icon, label: `${t('skill_' + s.id)}   ${'●'.repeat(r)}${'○'.repeat(s.max - r)}`,
        sub: t('sdesc_' + s.id, { v: this.fmtVal(s, Math.max(r, 1)) }) + (r === 0 && !s.locked ? ' (Lv.1)' : ''),
        right: s.locked ? '🔒' : r >= s.max ? 'MAX' : `→ ${s.per < 1 ? '' : '+'}${this.fmtVal(s, r + 1)}${s.per < 1 ? '%' : ''}`,
        enabled: !s.locked && r < s.max,
      };
    });
    if (m.type === 'journal') {
      if (m.tab === 'album') return Object.keys(PHOTO_SUBJECTS).map(id => {
        const a = profile.album.find(x => x.subjectId === id);
        return { icon: a ? PHOTO_ICONS[id] : '❔', label: a ? t('ph_' + id) : t('unknown'),
                 sub: a ? (a.date ? t('photo_date', { d: a.date }) : '') : '💡 ' + t('hint_' + id),
                 right: `+${PHOTO_SUBJECTS[id].exp} EXP`, enabled: !!a };
      });
      if (m.tab === 'passport') return PARKS.map(pk => {
        const pp = profile.passport[pk.id];
        let sub = t('coming_soon');
        if (pk.open) {
          const done = TRAILS.filter(x => x.parkId === pk.id && pp && pp.trails[x.id]);
          sub = done.length ? done.map(x => { const tr = pp.trails[x.id]; return t('passport_trail', { t: t(x.trailKey), n: tr.completions, b: fmtTime(tr.bestTimeSec) }); }).join(' · ')
            + (pp.firstDate ? ' · ' + t('first_date', { d: pp.firstDate }) : '') : t('not_stamped');
        }
        return { icon: pp && pp.stamped ? '🏅' : pk.open ? '⬜' : '🔒', label: t(pk.nameKey), sub, right: t('region_' + pk.region), enabled: !!(pp && pp.stamped) };
      });
      if (m.tab === 'achievements') return ACHIEVEMENTS.map(a => {
        const tier = achTier(a.id), v = a.value(), done = tier + 1 >= a.tiers.length;
        const next = done ? a.tiers[a.tiers.length - 1] : a.tiers[tier + 1];
        const vShown = Number.isInteger(v) ? v : v.toFixed(1);
        const tiersStr = a.tiers.map((_, i) => i <= tier ? TIERS[i].icon : '▫️').join('');
        return { icon: tier >= 0 ? TIERS[tier].icon : a.icon, label: `${t('ach_' + a.id)}  ${tiersStr}`,
                 sub: t('adesc_' + a.id, { v: vShown, n: next }) + ' · ' + (done ? t('ach_complete') : t('ach_next', { t: t('tier_' + TIERS[tier + 1].id) })),
                 right: done ? '' : `+${TIERS[tier + 1].coins}🪙`, enabled: tier >= 0 };
      });
      if (m.tab === 'medals') return MEDALS.map(md => {
        const got = profile.medals[md.id];
        const isRegion = ['north', 'northeast', 'west', 'central', 'east', 'south'].includes(md.id);
        const noTrail = isRegion && !TRAILS.some(x => x.region === md.id);
        return { icon: md.icon, medal: md, got: !!got, label: t('medal_' + md.id),
                 sub: noTrail ? t('coming_soon') : t('mdesc_' + (isRegion ? 'region' : md.id), { r: t('region_' + md.id) }),
                 right: got ? got : `+${MEDAL_COINS}🪙`, enabled: !!got };
      });
      if (m.tab === 'titles') return TITLES.map(ti => {
        const ok = ti.cond(), on = profile.title === ti.id;
        return { icon: on ? '🏷️' : ok ? '▫️' : '🔒', label: t('title_' + ti.id), sub: t('tcond_' + ti.id),
                 right: on ? t('equipped') : ok ? t('equip') : '', enabled: ok };
      });
      const st = profile.stats, L = Level.info();
      const rIdx = rankIndex(), nextRank = RANKS[rIdx + 1];
      const rankSub = nextRank ? t('rank_points', { p: achPoints(), n: nextRank[1] }) : t('rank_max', { p: achPoints() });
      return [
        ['🎖️', 'st_rank', rankName(), rankSub],
        ['🥾', 'st_trails', st.trailsCompleted], ['📏', 'st_distance', st.totalDistanceKm.toFixed(1) + ' km'],
        ['🗑️', 'st_litter', st.litterCollected], ['📷', 'st_photos', st.photosTaken],
        ['📅', 'st_days', profile.day], ['⭐', 'st_level', `Lv.${L.level} · ${profile.exp} EXP`],
      ].map(([icon, k, v, sub]) => ({ icon, label: t(k), sub: sub || '', right: String(v), enabled: true }));
    }
    if (m.type === 'shop') return CATALOG.map(e => {
      const crop = Object.values(CROPS).find(c => c.seed === e.id);
      const sub = lvl < e.level ? t('need_level', { n: e.level })
        : crop ? t('grows_in', { s: crop.seasons.map(s => t('season_' + s)).join(' / '), n: crop.days }) + ' · ' + t('have', { n: storeQty(e.id) })
        : t('have', { n: storeQty(e.id) });
      return { icon: ITEMS[e.id].icon, label: t('item_' + e.id), sub, right: `🪙 ${e.price}`, enabled: lvl >= e.level && profile.coins >= e.price };
    });
    if (m.type === 'cook') return RECIPES.map(r => ({
      icon: ITEMS[r.id].icon, label: t('item_' + r.id) + ` (${t('have', { n: storeQty(r.id) })})`,
      sub: Object.entries(r.needs).map(([k, n]) => `${ITEMS[k].icon} ${t('item_' + k)} ${storeQty(k)}/${n}`).join(' · '),
      right: t('tip_' + r.id), enabled: Object.entries(r.needs).every(([k, n]) => storeQty(k) >= n),
    }));
    return profile.quests.list.map(q => {
      const d = Quests.def(q.id);
      return { icon: q.done ? '✅' : '📌', label: t('q_' + d.id), sub: `${q.progress}/${d.count}`, right: `+${d.exp} EXP · 🪙 ${d.coins}`, enabled: !q.done };
    });
  },
  fmtVal(s, rank) { return Skills.value(s, rank); },
  confirm() {
    const m = state.menu;
    if (m.type === 'journal' && m.tab === 'titles') {
      const ti = TITLES[m.sel];
      if (!ti.cond()) { toast(t('tcond_' + ti.id)); return; }
      profile.title = ti.id; toast(t('msg_titleSet', { t: t('title_' + ti.id) })); Save.write(profile); return;
    }
    if (m.type === 'quests' || m.type === 'journal') { state.menu = null; return; }
    if (m.type === 'skills') { Skills.upgrade(m.sel); return; }
    if (m.type === 'trails') {
      const tr = TRAILS[m.sel];
      if (!trailUnlocked(tr)) { toast(t('msg_trailLocked')); return; }
      selectTrail(tr); Save.write(profile);
      state.menu = null; state.weather = rollWeather(); state.packRow = 0; state.screen = 'pack';
      return;
    }
    if (m.type === 'shop') {
      const e = CATALOG[m.sel], lvl = Level.info().level;
      if (lvl < e.level) { toast(t('msg_lockedLv', { n: e.level })); return; }
      if (profile.coins < e.price) { toast(t('msg_noCoins')); Sound.sfx('error'); return; }
      profile.coins -= e.price; addStore(e.id, 1); Sound.sfx('select');
      toast(t('msg_bought', { s: t('item_' + e.id) }));
    }
    if (m.type === 'cook') {
      const r = RECIPES[m.sel];
      if (!Object.entries(r.needs).every(([k, n]) => storeQty(k) >= n)) { toast(t('msg_noIngr')); Sound.sfx('error'); return; }
      Sound.noise(0.6, { vol: 0.12, freq: 3000, type: 'highpass' }); // sizzle
      for (const [k, n] of Object.entries(r.needs)) addStore(k, -n);
      addStore(r.id, 1);
      profile.stats.cooked = (profile.stats.cooked || 0) + 1;
      toast(t('msg_cooked', { s: t('item_' + r.id) })); Quests.notify('cook');
    }
    Save.write(profile);
  },
};

// ---------- Sound (Web Audio, all synthesized; no audio files) ----------
const Sound = {
  ctx: null, master: null, noiseBuf: null, amb: {}, timer: 0, stepT: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain(); this.master.gain.value = profile.sound === false ? 0 : 0.55; this.master.connect(ctx.destination);
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      const loop = (type, freq, q) => {
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(this.master); src.start();
        return g;
      };
      this.amb = { wind: loop('lowpass', 380, 0.5), water: loop('bandpass', 900, 0.6), rain: loop('highpass', 2500, 0.3), fire: loop('bandpass', 600, 0.8) };
    } catch (e) { this.ctx = null; }
  },
  on() { return this.ctx && profile.sound !== false; },
  toggle() {
    profile.sound = profile.sound === false; Save.write(profile);
    if (this.master) this.master.gain.setTargetAtTime(profile.sound ? 0.55 : 0, this.ctx.currentTime, 0.05);
    toast(profile.sound ? '🔊' : '🔇');
  },
  tone(freq, dur, { type = 'sine', vol = 0.15, to = null, delay = 0 } = {}) {
    if (!this.on()) return;
    const c = this.ctx, t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, { vol = 0.15, freq = 1500, type = 'bandpass', q = 1, delay = 0 } = {}) {
    if (!this.on()) return;
    const c = this.ctx, t0 = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
  },
  sfx(name) {
    switch (name) {
      case 'blip': this.tone(660, 0.05, { type: 'square', vol: 0.04 }); break;
      case 'select': this.tone(520, 0.08, { type: 'triangle', vol: 0.1 }); this.tone(780, 0.1, { type: 'triangle', vol: 0.1, delay: 0.07 }); break;
      case 'error': this.tone(180, 0.15, { type: 'square', vol: 0.06, to: 120 }); break;
      case 'shutter': this.noise(0.04, { vol: 0.25, freq: 3000 }); this.noise(0.06, { vol: 0.2, freq: 1800, delay: 0.08 }); break;
      case 'pickup': this.tone(880, 0.07, { type: 'triangle', vol: 0.1 }); this.tone(1320, 0.1, { type: 'triangle', vol: 0.1, delay: 0.06 }); break;
      case 'drink': this.tone(300, 0.12, { vol: 0.15, to: 700 }); this.tone(350, 0.12, { vol: 0.12, to: 800, delay: 0.14 }); break;
      case 'eat': this.noise(0.06, { vol: 0.15, freq: 900 }); this.noise(0.06, { vol: 0.15, freq: 1100, delay: 0.12 }); break;
      case 'splash': this.noise(0.5, { vol: 0.3, freq: 700, q: 0.5 }); break;
      case 'water': this.noise(0.35, { vol: 0.12, freq: 2500, type: 'highpass' }); break;
      case 'chime': [784, 988, 1175].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.1, delay: i * 0.08 })); break;
      case 'fanfare': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i === 3 ? 0.5 : 0.18, { type: 'square', vol: 0.06, delay: i * 0.11 })); break;
      case 'sleep': [660, 523, 440, 330].forEach((f, i) => this.tone(f, 0.4, { vol: 0.08, delay: i * 0.18 })); break;
      case 'sad': [392, 349, 311].forEach((f, i) => this.tone(f, 0.35, { type: 'triangle', vol: 0.08, delay: i * 0.22 })); break;
      case 'stamp': this.noise(0.12, { vol: 0.35, freq: 200, type: 'lowpass' }); this.sfx('fanfare'); break;
    }
  },
  step(tile) {
    const soft = tile === T.GRASS || tile === T.MOSS || tile === T.TALL;
    this.noise(0.05, { vol: soft ? 0.05 : 0.08, freq: tile === T.BRIDGE ? 500 : soft ? 2200 : 1200, q: 0.8 });
  },
  setAmb(name, v) { if (this.amb[name]) this.amb[name].gain.setTargetAtTime(v, this.ctx.currentTime, 0.6); },
  update(dt) {
    if (!this.ctx) return;
    Music.update();
    this.timer -= dt;
    if (this.timer > 0) return;
    this.timer = 0.1;
    const lv = { wind: 0, water: 0, rain: 0, fire: 0 };
    const h = state.screen === 'play' ? Time.hour() : 14, night = h >= 19 || h < 5;
    let birds = 0;
    if (state.screen === 'play' && state.player) {
      const p = state.player, tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
      let best = 99;
      for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) if (World.get(tx + dx, ty + dy) === T.WATER) best = Math.min(best, Math.hypot(dx, dy));
      if (best < 7) lv.water = 0.22 * (1 - best / 7);
      for (const d of (TRAIL.decor || []).filter(q => q.type === 'falls')) { const dd = Math.hypot(d.x + 1 - tx, d.y - ty); if (dd < 9) lv.water = Math.max(lv.water, 0.45 * (1 - dd / 9)); }
      if (state.lastZone === 'ridge' || state.lastZone === 'plateau') lv.wind = 0.1;
      if (Events.isActive('coldWind')) lv.wind = 0.3;
      if (state.weather === 'drizzle') lv.rain = 0.14;
      birds = night ? 0 : state.weather === 'drizzle' ? 0.05 : 0.35;
    } else if (state.screen === 'camp' || state.screen === 'pack') { lv.fire = 0.07; birds = 0.2; }
    else if (state.screen === 'title') birds = 0.15;
    for (const k in lv) this.setAmb(k, lv[k]);
    if (Math.random() < birds * 0.1) { // bird chirp
      const f = 2200 + Math.random() * 1600, n = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) this.tone(f, 0.08, { vol: 0.03, to: f * 1.3, delay: i * 0.12 });
    }
    if (state.screen === 'play' && TRAIL.ambient === 'gibbon' && !night && Math.random() < 0.012) // distant gibbon calls
      for (let i = 0; i < 6; i++) this.tone(500 + i * 90, 0.22, { type: 'sine', vol: 0.025, to: 900 + i * 120, delay: i * 0.26 });
    if (state.screen === 'play' && night && Math.random() < 0.06) for (let i = 0; i < 3; i++) this.tone(4200, 0.03, { type: 'square', vol: 0.012, delay: i * 0.06 }); // crickets
    if (lv.fire && Math.random() < 0.15) this.noise(0.03, { vol: 0.08, freq: 2500 }); // crackle
  },
};

// ---------- Music (generative, Web Audio) ----------
// Each scene has a mood: key, tempo, chord loop and instruments. A melody is generated from the
// pentatonic scale in 4-bar phrases played A A B A, then a new tune is written. Small "ching" cymbals
// (as in Thai ensembles) keep time on beats 2 and 4.
const MUSIC_MOODS = {
  title: { tempo: 84, key: 60, scale: 'maj', prog: [[0, 'M'], [9, 'm'], [5, 'M'], [7, 'M']], pad: 0.05, arp: false, ching: true, mel: 0.55 },
  camp:  { tempo: 70, key: 62, scale: 'maj', prog: [[0, 'M'], [5, 'M'], [9, 'm'], [7, 'M']], pad: 0.04, arp: true, ching: false, mel: 0.35 },
  hike:  { tempo: 100, key: 67, scale: 'maj', prog: [[0, 'M'], [4, 'm'], [5, 'M'], [7, 'M']], pad: 0.025, arp: false, ching: true, mel: 0.6 },
  night: { tempo: 58, key: 57, scale: 'min', prog: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']], pad: 0.05, arp: false, ching: false, mel: 0.25 },
};
const SCALES = { maj: [0, 2, 4, 7, 9], min: [0, 3, 5, 7, 10] };
const Music = {
  gain: null, mood: null, cfg: null, nextTime: 0, step: 0, phrases: null, rng: mulberry32(7), tuneCount: 0,
  on() { return Sound.ctx && profile.sound !== false && profile.music !== false; },
  freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  ensure() {
    if (!Sound.ctx || this.gain) return;
    this.gain = Sound.ctx.createGain(); this.gain.gain.value = 0; this.gain.connect(Sound.master);
  },
  toggle() {
    profile.music = profile.music === false; Save.write(profile);
    toast(profile.music ? t('msg_musicOn') : t('msg_musicOff'));
  },
  pickMood() {
    const s = state.screen;
    if (s === 'title') return 'title';
    if (s === 'play') { const h = Time.hour(); return (h >= 19 || h < 5) ? 'night' : 'hike'; }
    return 'camp';
  },
  setMood(m) {
    const cfg = { ...MUSIC_MOODS[m] };
    if (m === 'hike') cfg.key += [0, -2, 2, -5][TRAILS.indexOf(TRAIL)] || 0; // each trail in its own key
    this.mood = m; this.cfg = cfg; this.step = 0; this.phrases = null;
    this.nextTime = Sound.ctx.currentTime + 0.6;
    const g = this.gain.gain, now = Sound.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(0, now); g.linearRampToValueAtTime(0.32, now + 2.5); // fade in
  },
  writeTune() { // phrases A and B: 4 bars × 8 eighth notes each
    const cfg = this.cfg, sc = SCALES[cfg.scale], rng = this.rng;
    const notes = []; for (let o = 0; o < 2; o++) for (const d of sc) notes.push(cfg.key + 12 + o * 12 + d);
    const make = () => {
      let idx = 4 + Math.floor(rng() * 3);
      return [0, 1, 2, 3].map(bar => {
        const [root, q] = cfg.prog[bar], chord = [root, root + (q === 'M' ? 4 : 3), root + 7].map(n => ((n % 12) + 12) % 12);
        return Array.from({ length: 8 }, (_, b) => {
          if (rng() > cfg.mel && b !== 0) return null;
          idx = clamp(idx + [-2, -1, -1, 0, 1, 1, 2][Math.floor(rng() * 7)], 0, notes.length - 1);
          if (b === 0 || b === 4) { // lean on chord tones on strong beats
            let best = idx, bd = 99;
            notes.forEach((n, i) => { if (chord.includes((n - cfg.key + 120) % 12) && Math.abs(i - idx) < bd) { bd = Math.abs(i - idx); best = i; } });
            idx = best;
          }
          return notes[idx];
        });
      });
    };
    this.phrases = { A: make(), B: make() };
    this.tuneCount++;
  },
  // instruments
  pluck(f, t, vol, dur = 0.9) {
    const c = Sound.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 6, t); lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const g2 = c.createGain(); g2.gain.value = 0.25;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(this.gain);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  },
  pad(freqs, t, dur, vol) {
    const c = Sound.ctx, g = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.3); g.gain.linearRampToValueAtTime(0, t + dur * 1.05);
    lp.connect(g); g.connect(this.gain);
    for (const f of freqs) for (const det of [-6, 6]) { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(t); o.stop(t + dur * 1.1); }
  },
  bass(f, t, vol) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + 0.75);
  },
  ching(t, open) { // small Thai hand cymbals: bright metallic ring ("ching") or a short damped "chap"
    const c = Sound.ctx, s = c.createBufferSource(), hp = c.createBiquadFilter(), g = c.createGain();
    s.buffer = Sound.noiseBuf; hp.type = 'highpass'; hp.frequency.value = 6500;
    const d = open ? 0.35 : 0.06;
    g.gain.setValueAtTime(open ? 0.05 : 0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(hp); hp.connect(g); g.connect(this.gain); s.start(t, Math.random()); s.stop(t + d + 0.02);
    if (open) { const o = c.createOscillator(), og = c.createGain(); o.type = 'sine'; o.frequency.value = 4186; og.gain.setValueAtTime(0.012, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.4); o.connect(og); og.connect(this.gain); o.start(t); o.stop(t + 0.45); }
  },
  scheduleStep(i, t) {
    const cfg = this.cfg, eighth = 60 / cfg.tempo / 2, barLen = eighth * 8;
    const bar = Math.floor(i / 8), beat = i % 8, section = Math.floor(bar / 4) % 4, barIn = bar % 4;
    if (!this.phrases || (beat === 0 && bar > 0 && bar % 16 === 0)) this.writeTune(); // a new tune every 16 bars
    const [root, q] = cfg.prog[barIn], third = q === 'M' ? 4 : 3, base = cfg.key - 12 + root;
    if (beat === 0) {
      if (cfg.pad) this.pad([base + 12, base + 12 + third, base + 19].map(m => this.freq(m)), t, barLen, cfg.pad);
      this.bass(this.freq(base - 12), t, 0.09);
    }
    if (beat === 4) this.bass(this.freq(base - 5), t, 0.06);
    if (cfg.ching && (beat === 2 || beat === 6)) this.ching(t, beat === 2);
    if (cfg.ching && (beat === 4) && cfg.tempo > 90) this.ching(t, false);
    if (cfg.arp) { const arp = [0, third, 7, 12, 7, third, 0, 7][beat]; this.pluck(this.freq(base + 12 + arp), t, 0.035, 0.7); }
    const phrase = this.phrases[['A', 'A', 'B', 'A'][section]], note = phrase[barIn][beat];
    if (note) this.pluck(this.freq(note), t, 0.075, cfg.tempo < 70 ? 1.4 : 0.9);
  },
  update() {
    if (!Sound.ctx) return;
    this.ensure();
    if (!this.on()) { if (this.gain.gain.value > 0.001 && !this.muted) { const now = Sound.ctx.currentTime; this.gain.gain.cancelScheduledValues(now); this.gain.gain.setTargetAtTime(0, now, 0.3); this.muted = true; } return; }
    if (this.muted) { this.muted = false; this.mood = null; }
    const m = this.pickMood();
    if (m !== this.mood || !this.cfg) this.setMood(m);
    const ctx = Sound.ctx, eighth = 60 / this.cfg.tempo / 2;
    if (this.nextTime < ctx.currentTime - 1) this.nextTime = ctx.currentTime + 0.05; // tab was in the background
    while (this.nextTime < ctx.currentTime + 0.3) { this.scheduleStep(this.step, this.nextTime); this.nextTime += eighth; this.step++; }
  },
};

// Input
const keys = {};
const vkeys = {}; // virtual keys held by touch controls
const input = () => ({
  left: keys.ArrowLeft || keys.KeyA || vkeys.left, right: keys.ArrowRight || keys.KeyD || vkeys.right,
  up: keys.ArrowUp || keys.KeyW || vkeys.up, down: keys.ArrowDown || keys.KeyS || vkeys.down,
  run: keys.ShiftLeft || keys.ShiftRight || vkeys.run,
});
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  Sound.init();
  if (!e.repeat) handleKey(e.code);
});
// All discrete actions go through here (keyboard and touch buttons).
function handleKey(code) {
  const e = { code };
  if (e.code === 'KeyM') { Sound.toggle(); return; }
  if (e.code === 'KeyN') { Music.toggle(); return; }
  if (state.screen === 'camp' && state.menu && ['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS', 'ArrowLeft', 'ArrowRight'].includes(e.code)) Sound.sfx('blip');
  if ((state.screen === 'title' || state.screen === 'pack') && e.code.startsWith('Arrow')) Sound.sfx('blip');
  if (e.code === 'KeyL') { profile.lang = profile.lang === 'th' ? 'en' : 'th'; Save.write(profile); return; }
  if (state.screen === 'title') {
    const nR = TITLE_ROWS.length, row = TITLE_ROWS[state.titleRow];
    if (e.code === 'ArrowUp' || e.code === 'KeyW') state.titleRow = (state.titleRow + nR - 1) % nR;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') state.titleRow = (state.titleRow + 1) % nR;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') stepTitleOpt(row, -1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') stepTitleOpt(row, 1);
    if (e.code === 'Tab') stepTitleOpt('body', 1);
    if (e.code === 'Enter' || e.code === 'Space') { if (row === 'name') nameInput.focus(); else startFromTitle(); }
    return;
  }
  if (state.screen === 'camp') {
    if (state.menu) {
      const n = Menus.rows().length;
      if (n && (e.code === 'ArrowUp' || e.code === 'KeyW')) state.menu.sel = (state.menu.sel + n - 1) % n;
      if (n && (e.code === 'ArrowDown' || e.code === 'KeyS')) state.menu.sel = (state.menu.sel + 1) % n;
      if (state.menu.type === 'journal' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD')) {
        const i = JOURNAL_TABS.indexOf(state.menu.tab), d = (e.code === 'ArrowLeft' || e.code === 'KeyA') ? -1 : 1;
        state.menu.tab = JOURNAL_TABS[(i + d + JOURNAL_TABS.length) % JOURNAL_TABS.length]; state.menu.sel = 0;
      }
      const closeKey = { quests: 'KeyE', skills: 'KeyK', journal: 'KeyJ' }[state.menu.type];
      if (e.code === closeKey && state.menu.type !== 'quests') { state.menu = null; return; }
      if (e.code === 'Enter' || e.code === 'Space' || (e.code === 'KeyE' && state.menu.type === 'quests')) Menus.confirm();
      else if (e.code === 'Escape' || e.code === 'KeyB') state.menu = null;
      return;
    }
    if (e.code === 'KeyK') { state.build = null; state.menu = { type: 'skills', sel: 0 }; return; }
    if (e.code === 'KeyJ') { state.build = null; state.menu = { type: 'journal', tab: 'album', sel: 0 }; return; }
    if (e.code === 'KeyB') { Camp.toggleBuild(); return; }
    if (state.build) {
      if (e.code === 'BracketLeft') state.build.sel--;
      if (e.code === 'BracketRight' || e.code === 'KeyQ') state.build.sel++;
      if (e.code === 'KeyE' || e.code === 'Space') Camp.place();
      if (e.code === 'KeyX') Camp.pickUp();
      if (e.code === 'Escape') state.build = null;
      return;
    }
    if (e.code === 'KeyQ') { state.seedSel = (state.seedSel || 0) + 1; const c = Camp.selectedCrop(); if (c) toast(t('seed_sel', { s: t('item_' + CROPS[c].produce), n: storeQty(CROPS[c].seed) })); }
    if (e.code === 'KeyE' || e.code === 'Space') Camp.run(Camp.find());
    if (e.code === 'Escape') state.screen = 'title';
    return;
  }
  if (state.screen === 'pack') {
    const ids = packIds(), n = ids.length;
    state.packRow = Math.min(state.packRow, n - 1);
    const id = ids[state.packRow];
    if (e.code === 'ArrowUp' || e.code === 'KeyW') state.packRow = (state.packRow + n - 1) % n;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') state.packRow = (state.packRow + 1) % n;
